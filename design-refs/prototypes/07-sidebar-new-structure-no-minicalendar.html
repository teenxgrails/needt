<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sidebar new structure no minicalendar — Needt prototype</title>
<style>
:root{
  --surface-0:#17150F; --surface-1:#211E17; --surface-2:#2A2620; --surface-3:#332E24;
  --border:#332E24; --border-strong:#4A4338; --border-accent:#C96442;
  --text-primary:#EDE7DA; --text-secondary:#9A9184; --text-muted:#6E675C;
  --text-accent:#C96442; --bg-accent:#2A1F19; --fill-accent:#C96442;
  --fill-ghost-selected:rgba(201,100,66,.14); --now:#D8734F;
}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--surface-0);color:var(--text-primary);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;}
button{background:var(--surface-2);color:var(--text-primary);border:.5px solid var(--border-strong);
  border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;
  transition:transform 90ms cubic-bezier(.4,0,.2,1),background 160ms ease;}
button:hover{background:var(--surface-3)}
button:active{transform:scale(.98)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
.proto-head{max-width:900px;margin:0 auto 16px;color:var(--text-secondary);font-size:12px;
  letter-spacing:.04em;text-transform:uppercase}
.proto-wrap{max-width:900px;margin:0 auto}
</style></head><body>
<div class="proto-head">07 · sidebar new structure no minicalendar</div>
<div class="proto-wrap">
<h2 class="sr-only">Новый сайдбар Needt без мини-календаря: четыре места вместо семи разделов, кнопка захвата и Фокус как режим</h2>

<div style="background:var(--surface-1);border-radius:12px;padding:10px;">
<div style="display:flex;height:400px;background:#17150F;border:0.5px solid #332E24;border-radius:8px;overflow:hidden;">

  <div style="width:212px;flex:none;border-right:0.5px solid #332E24;display:flex;flex-direction:column;">

    <div style="height:36px;display:flex;align-items:center;padding-left:12px;gap:7px;">
      <span style="width:10px;height:10px;border-radius:50%;background:#ED9A93;"></span>
      <span style="width:10px;height:10px;border-radius:50%;background:#EBC06B;"></span>
      <span style="width:10px;height:10px;border-radius:50%;background:#9BC97F;"></span>
      <span style="margin-left:9px;font-size:13px;font-weight:500;color:#EDE7DA;letter-spacing:-0.01em;">Needt</span>
    </div>

    <div style="padding:6px 10px 10px;">
      <button id="cap" style="width:100%;height:34px;border:none;border-radius:8px;position:relative;overflow:hidden;background:#C96442;color:#1A0F0A;font-size:12.5px;padding:0;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform 90ms cubic-bezier(.4,0,.2,1);">
        <span style="position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.28);"></span>
        <i class="ti ti-plus" style="font-size:14px;" aria-hidden="true"></i>Создать
        <span style="font-size:10px;opacity:.6;font-variant-numeric:tabular-nums;">⌘N</span>
      </button>
    </div>

    <div style="position:relative;padding:0 8px;flex:1;">
      <div id="pill" style="position:absolute;left:8px;right:8px;height:30px;background:#241F18;border-radius:6px;transform:translateY(0);transition:transform 320ms cubic-bezier(.22,1,.32,1);"></div>
      <div id="nav" style="position:relative;"></div>

      <div style="margin:14px 4px 6px;font-size:10px;letter-spacing:.06em;color:#6F675B;">ПРОЕКТЫ</div>
      <div id="proj"></div>
    </div>

    <div style="padding:8px 10px;border-top:0.5px solid #332E24;">
      <div id="focus" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border:0.5px solid #332E24;border-radius:6px;cursor:pointer;">
        <i class="ti ti-target" style="font-size:15px;color:#9A9184;" aria-hidden="true"></i>
        <span style="font-size:12.5px;color:#9A9184;">Фокус</span>
        <span style="margin-left:auto;font-size:10px;color:#6F675B;">режим</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px;padding:0 2px;">
        <span style="width:20px;height:20px;border-radius:50%;background:#2A1F19;color:#C96442;font-size:9px;display:flex;align-items:center;justify-content:center;">MX</span>
        <span style="font-size:12.5px;color:#EDE7DA;">Максим</span>
        <i class="ti ti-selector" style="margin-left:auto;font-size:14px;color:#6F675B;" aria-hidden="true"></i>
      </div>
    </div>

  </div>

  <div style="flex:1;padding:12px 14px;min-width:0;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <div id="ttl" style="font-size:15px;color:#EDE7DA;">День</div>
      <div style="margin-left:auto;display:flex;border:0.5px solid #332E24;border-radius:6px;overflow:hidden;">
        <span id="r1" style="font-size:11px;padding:4px 10px;color:#1A0F0A;background:#C96442;cursor:pointer;">День</span>
        <span id="r2" style="font-size:11px;padding:4px 10px;color:#9A9184;cursor:pointer;">Неделя</span>
      </div>
    </div>
    <div id="cv" style="position:relative;height:300px;"></div>
  </div>

</div>
</div>

<script>
(function(){
  var items=[['ti-layout-rows','День'],['ti-checkbox','Работа','4'],['ti-inbox','Входящие','2'],['ti-file-text','Документы']];
  var nav=document.getElementById('nav'),pill=document.getElementById('pill'),ttl=document.getElementById('ttl');

  items.forEach(function(it,ix){
    var r=document.createElement('div');
    r.style.cssText='position:relative;display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:6px;cursor:pointer;color:'+(ix?'#9A9184':'#EDE7DA')+';transition:color 150ms ease;';
    r.innerHTML='<i class="ti '+it[0]+'" style="font-size:15px;" aria-hidden="true"></i><span style="font-size:12.5px;">'+it[1]+'</span>'+
      (it[2]?'<span style="margin-left:auto;font-size:10px;font-variant-numeric:tabular-nums;color:#6F675B;">'+it[2]+'</span>':'');
    r.onclick=function(){
      pill.style.transform='translateY('+(ix*32)+'px)';
      Array.prototype.forEach.call(nav.children,function(c,ci){ if(c.tagName==='DIV'&&c.style.height) c.style.color= ci===ix?'#EDE7DA':'#9A9184'; });
      ttl.textContent=it[1];
    };
    nav.appendChild(r);
    var s=document.createElement('div'); s.style.height='2px'; nav.appendChild(s);
  });

  var pj=[['#7FA6C9','Needt v1'],['#C9A87F','Resale'],['#8FC99B','Биты']];
  var pc=document.getElementById('proj');
  pj.forEach(function(p){
    var e=document.createElement('div');
    e.style.cssText='display:flex;align-items:center;gap:9px;height:26px;padding:0 8px;border-radius:6px;color:#9A9184;cursor:pointer;';
    e.innerHTML='<span style="width:7px;height:7px;border-radius:2px;background:'+p[0]+';flex:none;"></span><span style="font-size:12px;">'+p[1]+'</span>';
    e.onmouseenter=function(){e.style.background='#1E1B15';e.style.color='#EDE7DA';};
    e.onmouseleave=function(){e.style.background='transparent';e.style.color='#9A9184';};
    pc.appendChild(e);
  });

  var b=document.getElementById('cap');
  b.addEventListener('pointerdown',function(){b.style.transition='transform 90ms cubic-bezier(.4,0,.2,1)';b.style.transform='scale(.98)';});
  ['pointerup','pointerleave'].forEach(function(e){b.addEventListener(e,function(){b.style.transition='transform 340ms cubic-bezier(.34,1.4,.5,1)';b.style.transform='scale(1)';});});

  var cv=document.getElementById('cv'),H=30;
  var h='';
  for(var g=0;g<10;g++){
    h+='<div style="position:absolute;left:0;right:0;top:'+(g*H)+'px;border-top:0.5px solid #332E24;"></div>';
    h+='<div style="position:absolute;left:0;top:'+(g*H+3)+'px;font-size:9px;font-variant-numeric:tabular-nums;color:#6F675B;">'+(9+g)+':00</div>';
  }
  [['Стендап',0,.5,0],['Обзор макетов',.75,1.25,1],['Обед',3,1,0],['Глубокая работа',4.25,1.75,1]].forEach(function(x){
    var tp=x[1]*H+1,hh=x[2]*H-3;
    h+='<div style="position:absolute;left:34px;right:8px;top:'+tp+'px;height:'+hh+'px;box-sizing:border-box;padding:3px 7px;overflow:hidden;'+
      (x[3]?'background:transparent;border:1px dashed #C96442;border-radius:4px;':'background:#211E17;border:0.5px solid #332E24;border-left:2px solid #9A9184;')+'">'+
      '<div style="font-size:10px;color:#EDE7DA;line-height:1.2;">'+x[0]+'</div></div>';
  });
  h+='<div style="position:absolute;left:28px;right:0;top:'+(2.4*H)+'px;height:1px;background:#D8734F;"></div>';
  cv.innerHTML=h;
})();
</script>
</div></body></html>
