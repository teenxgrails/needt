<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>schedule reflow signature moment — Needt prototype</title>
<style>
:root{
  --surface-0:#17150F; --surface-1:#211E17; --surface-2:#2A2620; --surface-3:#332E24;
  --border:#332E24; --border-strong:#4A4338; --border-accent:#C96442;
  --text-primary:#EDE7DA; --text-secondary:#9A9184; --text-muted:#6E675C;
  --text-accent:#C96442; --bg-accent:#2A1F19; --fill-accent:#C96442;
  --fill-ghost-selected:rgba(201,100,66,.14); --now:#D8734F;
}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--surface-0);color:var(--text-primary);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;}
button{background:var(--surface-2);color:var(--text-primary);border:.5px solid var(--border-strong);
  border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;
  transition:transform 90ms cubic-bezier(.4,0,.2,1),background 160ms ease;}
button:hover{background:var(--surface-3)}
button:active{transform:scale(.98)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
.proto-head{max-width:900px;margin:0 auto 16px;color:var(--text-secondary);font-size:12px;
  letter-spacing:.04em;text-transform:uppercase}
.proto-wrap{max-width:900px;margin:0 auto}
</style></head><body>
<div class="proto-head">01 · schedule reflow signature moment</div>
<div class="proto-wrap">
<h2 class="sr-only">Интерактивная демонстрация: при добавлении встречи задачи дня плавно переезжают на новое время</h2>

<div style="background: var(--surface-1); border-radius: 12px; padding: 1.25rem;">

  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
    <div style="font-size:13px; color:var(--text-secondary); letter-spacing:0.02em;">Вторник, 25 августа</div>
    <div style="display:flex; gap:8px;">
      <button id="act" style="font-size:13px;">Добавить встречу 14:00</button>
      <button id="undo" style="font-size:13px; display:none;">Отменить</button>
    </div>
  </div>

  <div id="note" style="height:20px; margin-bottom:10px; font-size:13px; color:var(--text-secondary); opacity:0; transition:opacity 220ms ease;"></div>

  <div id="stage" style="position:relative; height:420px; border-top:0.5px solid var(--border);">
    <div id="grid"></div>
    <div id="blocks"></div>
  </div>

</div>

<script>
(function(){
  var H0=9, H1=18, PXH=44;
  var stage=document.getElementById('blocks');
  var grid=document.getElementById('grid');
  var note=document.getElementById('note');
  var act=document.getElementById('act');
  var undo=document.getElementById('undo');

  for(var h=H0; h<=H1; h++){
    var y=(h-H0)*PXH;
    var line=document.createElement('div');
    line.style.cssText='position:absolute;left:0;right:0;top:'+y+'px;border-top:0.5px solid var(--border);';
    grid.appendChild(line);
    var lab=document.createElement('div');
    lab.style.cssText='position:absolute;left:0;top:'+(y+3)+'px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-muted);width:44px;';
    lab.textContent=(h<10?'0':'')+h+':00';
    grid.appendChild(lab);
  }

  var base=[
    {id:'a', t:'Обзор макетов', s:9,    d:1,   k:'task'},
    {id:'b', t:'Дейли',         s:10,   d:0.5, k:'fixed'},
    {id:'c', t:'Глубокая работа: онбординг', s:10.5, d:1.5, k:'task'},
    {id:'d', t:'Обед',          s:12,   d:1,   k:'fixed'},
    {id:'e', t:'Ответить на почту', s:13, d:0.5, k:'task'},
    {id:'f', t:'Правки биллинга', s:13.5, d:1.5, k:'task'},
    {id:'g', t:'Ретро',         s:16,   d:1,   k:'fixed'}
  ];

  var after=[
    {id:'a', s:9},    {id:'b', s:10},   {id:'c', s:10.5},
    {id:'d', s:12},   {id:'e', s:13},   {id:'f', s:15},
    {id:'x', s:14},   {id:'g', s:16}
  ];

  var meeting={id:'x', t:'Разбор дизайна', s:14, d:1, k:'meeting'};
  var nodes={};

  function fmt(v){var h=Math.floor(v), m=Math.round((v-h)*60);return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;}

  function make(b){
    var el=document.createElement('div');
    var accent = b.k==='meeting' ? 'var(--border-accent)' : (b.k==='fixed' ? 'var(--border-strong)' : 'var(--border-accent)');
    var bg = b.k==='meeting' ? 'var(--bg-accent)' : 'var(--surface-2)';
    el.style.cssText='position:absolute;left:52px;right:6px;box-sizing:border-box;'+
      'height:'+(b.d*PXH-6)+'px;background:'+bg+';border:0.5px solid var(--border);'+
      'border-left:2px solid '+accent+';border-radius:0;padding:6px 10px;'+
      'transform:translateY('+((b.s-H0)*PXH)+'px);'+
      'transition:transform 520ms cubic-bezier(.22,1,.32,1), opacity 260ms ease;';
    el.innerHTML='<div style="font-size:13px;color:var(--text-primary);line-height:1.25;">'+b.t+'</div>'+
      '<div style="font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-muted);margin-top:2px;">'+fmt(b.s)+'</div>';
    return el;
  }

  base.forEach(function(b){var el=make(b);nodes[b.id]=el;stage.appendChild(el);});

  var moved=false;

  function apply(list, order){
    list.forEach(function(p, i){
      var el=nodes[p.id]; if(!el) return;
      var cur=el.__s;
      if(cur===p.s) { el.style.transitionDelay='0ms'; return; }
      el.style.transitionDelay=(order? i*45 : 0)+'ms';
      el.style.transform='translateY('+((p.s-H0)*PXH)+'px)';
      el.__s=p.s;
      var lab=el.lastElementChild; if(lab) lab.textContent=fmt(p.s);
    });
  }

  base.forEach(function(b){nodes[b.id].__s=b.s;});

  act.addEventListener('click', function(){
    if(moved) return; moved=true;
    var el=make(meeting); el.style.opacity='0'; nodes['x']=el; el.__s=meeting.s; stage.appendChild(el);
    requestAnimationFrame(function(){ el.style.opacity='1'; });
    apply(after, true);
    note.textContent='Перенёс 1 задачу, чтобы освободить 14:00 под «Разбор дизайна».';
    note.style.opacity='1';
    undo.style.display='inline-flex';
    act.style.display='none';
  });

  undo.addEventListener('click', function(){
    moved=false;
    var x=nodes['x'];
    if(x){ x.style.opacity='0'; setTimeout(function(){ if(x.parentNode) x.parentNode.removeChild(x); }, 260); delete nodes['x']; }
    apply(base.map(function(b){return {id:b.id, s:b.s};}), true);
    note.style.opacity='0';
    undo.style.display='none';
    act.style.display='inline-flex';
  });
})();
</script>
</div></body></html>
