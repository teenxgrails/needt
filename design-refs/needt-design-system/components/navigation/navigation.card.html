<!doctype html><html><head><meta charset="utf-8"><title>Navigation</title><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg);font-family:var(--font-sans)}#root{padding:20px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const NSX = window.NeedtDesignSystem_053851;

const {NavItem, Tabs, Breadcrumb, TeamSwitcher, SectionHeader} = NSX;
function Demo(){
  const [tab,setTab] = React.useState('Board');
  const [nav,setNav] = React.useState('Tasks');
  return <div style={{display:'flex',gap:28}}>
    <div style={{width:250,display:'flex',flexDirection:'column',gap:2}}>
      <TeamSwitcher team="David Visuals" initials="DV"/>
      <div style={{height:8}}/>
      {[['Home','home'],['Tasks','check-square'],['Docs','file']].map(([l,i])=><NavItem key={l} label={l} icon={i} active={nav===l} onClick={()=>setNav(l)}/>)}
      <div style={{height:10}}/>
      <SectionHeader label="File" expanded/>
      <NavItem label="Store" icon="store"/>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:18,paddingTop:4}}>
      <Breadcrumb items={['Dashboard','Overview']}/>
      <Tabs tabs={['Board','List','Timeline','Due Tasks']} value={tab} onChange={setTab}/>
      <span style={{fontSize:10,color:'var(--text-muted)'}}>Rows and tabs are live — click them.</span>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);

</script></body></html>
