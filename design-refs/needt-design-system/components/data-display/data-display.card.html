<!-- @dsCard group="Components" viewport="700x220" name="Data display" subtitle="Tag pills, avatars, progress rings, dots, counts" -->
<!doctype html><html><head><meta charset="utf-8"><title>Data display</title><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg);font-family:var(--font-sans)}#root{padding:20px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const NSX = window.NeedtDesignSystem_053851;

const {TagPill, Avatar, ProgressRing, StatusDot, CountBadge} = NSX;
const Row = ({label, children}) => <div style={{display:'flex',alignItems:'center',gap:12}}><span style={{width:80,fontSize:10,color:'var(--text-muted)'}}>{label}</span><span style={{display:'flex',alignItems:'center',gap:10,color:'var(--text-muted)',fontSize:11}}>{children}</span></div>;
ReactDOM.createRoot(document.getElementById('root')).render(
 <div style={{display:'flex',flexDirection:'column',gap:14}}>
  <Row label="tag pill"><TagPill label="Web" color="blue"/><TagPill label="Saas" color="amber"/><TagPill label="Mobile" color="purple"/></Row>
  <Row label="avatar"><Avatar initials="PB" size={18}/><Avatar initials="PB" size={20}/><Avatar initials="DV" size={34}/></Row>
  <Row label="progress">{[0,25,50,75,100].map(v=><span key={v} style={{display:'flex',alignItems:'center',gap:4}}><ProgressRing value={v}/>{v}%</span>)}</Row>
  <Row label="status dot">{['todo','progress','review','done'].map(s=><span key={s} style={{display:'flex',alignItems:'center',gap:6}}><StatusDot status={s}/>{s}</span>)}</Row>
  <Row label="count"><CountBadge>3</CountBadge><CountBadge>12</CountBadge><CountBadge>Overview</CountBadge></Row>
 </div>);

</script></body></html>
