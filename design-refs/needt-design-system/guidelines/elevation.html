<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);font-family:var(--font-sans)}.pad{padding:20px}</style></head><body><div class="pad" style="display:flex;gap:16px;align-items:center">
<div style="display:flex;flex-direction:column;gap:6px"><div style="width:190px;height:72px;border-radius:var(--radius-xl);background:var(--surface);border:1px solid var(--border);box-shadow:none"></div><span style="font-size:10px;color:var(--text-muted)">rest</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:190px;height:72px;border-radius:var(--radius-xl);background:var(--surface);border:1px solid var(--border-strong);box-shadow:0 1px 2px 0 rgba(0,0,0,0.05)"></div><span style="font-size:10px;color:var(--text-muted)">hover</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:190px;height:72px;border-radius:var(--radius-xl);background:var(--surface);border:1px dashed var(--border);box-shadow:none"></div><span style="font-size:10px;color:var(--text-muted)">dashed</span></div>
</div></body></html>
