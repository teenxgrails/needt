<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);font-family:var(--font-sans)}.pad{padding:20px}</style></head><body><div class="pad" style="display:flex;gap:12px">

</div></body></html>
