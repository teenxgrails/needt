<html lang="en"><head><meta charset="utf-8"><title>Needt — the mark, and what this can do</title>

<style>
@font-face { font-family: "Exposure VAR"; src: url("./ExposureTrialVAR.woff2") format("woff2-variations"); font-display: block; }

html, body { height: 100%; margin: 0; background: var(--background); overflow: auto; }
#page { width: 100%; }

/* ── THE PLATE ───────────────────────────────────────────────────────────
   An app icon's silhouette is a SUPERELLIPSE, not a rounded rectangle:
   |x|^n + |y|^n = 1 with n near 5. A border-radius corner is a circular arc
   spliced onto a straight edge, so the curvature jumps at the splice — at icon
   size that jump is visible as a slight pinch at each corner. The path here is
   generated from the formula at load, so the curvature is continuous all the
   way round. */
.plate {
  position: relative; aspect-ratio: 1; display: grid; place-items: center;
  isolation: isolate; overflow: hidden;
}
/* Iridescence is not one gradient. It is several wide, low-saturation light
   sources overlapping on a near-white ground — which is what makes it read as
   a coated surface catching a room rather than as a colour ramp. */
.plate-light {
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(88% 72% at 24% 12%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 62%),
    radial-gradient(96% 84% at 104% 106%, rgba(224, 231, 242, 0.78) 0%, rgba(224, 231, 242, 0) 64%),
    linear-gradient(152deg, #f4f9fd 0%, #fbfafc 46%, #f7f3f7 74%, #eef2f7 100%);
}
.plate-cloud .plate-light {
  background:
    /* the light, broad and from the upper left */
    radial-gradient(120% 96% at 14% 4%, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0) 66%),
    /* three masses: large low-left, small high-right, broad base */
    radial-gradient(46% 34% at 30% 62%, rgba(255, 255, 255, 0.97) 0%, rgba(255, 255, 255, 0.55) 52%, rgba(255, 255, 255, 0) 78%),
    radial-gradient(30% 24% at 72% 34%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.42) 54%, rgba(255, 255, 255, 0) 80%),
    radial-gradient(64% 30% at 54% 88%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.3) 56%, rgba(255, 255, 255, 0) 82%),
    /* the undersides, cool and heavier than the tops */
    radial-gradient(52% 26% at 26% 80%, rgba(176, 196, 222, 0.5) 0%, rgba(176, 196, 222, 0) 72%),
    radial-gradient(34% 20% at 74% 52%, rgba(176, 196, 222, 0.42) 0%, rgba(176, 196, 222, 0) 74%),
    /* sky */
    linear-gradient(168deg, #d9e9f7 0%, #eaf3fb 52%, #f6f4f2 100%);
}
.plate-cumulus .plate-light {
  background:
    /* sun behind the cloud line, so the rim warms where it is thinnest */
    radial-gradient(58% 40% at 78% 16%, rgba(255, 246, 228, 0.95) 0%, rgba(255, 246, 228, 0) 60%),
    /* seven masses, none the same size, none at the same height */
    radial-gradient(26% 20% at 16% 54%, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.34) 58%, rgba(255,255,255,0) 82%),
    radial-gradient(38% 28% at 36% 64%, rgba(255,255,255,0.99) 0%, rgba(255,255,255,0.4) 56%, rgba(255,255,255,0) 80%),
    radial-gradient(20% 16% at 52% 46%, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.3) 58%, rgba(255,255,255,0) 84%),
    radial-gradient(30% 22% at 68% 60%, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0.34) 56%, rgba(255,255,255,0) 80%),
    radial-gradient(16% 13% at 84% 50%, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.26) 58%, rgba(255,255,255,0) 84%),
    radial-gradient(56% 22% at 46% 82%, rgba(255,255,255,0.94) 0%, rgba(255,255,255,0.3) 54%, rgba(255,255,255,0) 80%),
    radial-gradient(22% 15% at 26% 38%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.18) 60%, rgba(255,255,255,0) 86%),
    /* the flat, cool base every cumulus has */
    radial-gradient(70% 18% at 46% 88%, rgba(150, 172, 200, 0.55) 0%, rgba(150, 172, 200, 0) 76%),
    radial-gradient(34% 14% at 34% 74%, rgba(150, 172, 200, 0.45) 0%, rgba(150, 172, 200, 0) 78%),
    linear-gradient(172deg, #a9cdee 0%, #cde2f6 44%, #e8ddc9 100%);
}
.plate-volume .plate-light {
  background:
    /* one specular hit, tight — a solid, not a scatter */
    radial-gradient(20% 15% at 30% 30%, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 62%),
    radial-gradient(16% 12% at 64% 22%, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0) 64%),
    /* the occlusion crescents: where light stops rather than wraps */
    radial-gradient(30% 20% at 44% 76%, rgba(74, 94, 122, 0.62) 0%, rgba(74, 94, 122, 0) 70%),
    radial-gradient(22% 15% at 74% 60%, rgba(74, 94, 122, 0.5) 0%, rgba(74, 94, 122, 0) 72%),
    /* the masses themselves, bright-topped and dense */
    radial-gradient(40% 30% at 36% 48%, #ffffff 0%, #e8eef6 62%, rgba(232,238,246,0) 80%),
    radial-gradient(28% 22% at 70% 40%, #ffffff 0%, #e4ebf4 60%, rgba(228,235,244,0) 80%),
    radial-gradient(52% 26% at 50% 74%, #f6f9fc 0%, #dae3ee 60%, rgba(218,227,238,0) 82%),
    linear-gradient(160deg, #b9d2ea 0%, #d6e5f3 58%, #eef0f2 100%);
}
.plate-dark .plate-light {
  background:
    radial-gradient(88% 72% at 24% 12%, rgba(96, 116, 134, 0.30) 0%, rgba(96, 116, 134, 0) 62%),
    radial-gradient(96% 84% at 104% 106%, rgba(0, 0, 0, 0.42) 0%, rgba(0, 0, 0, 0) 64%),
    linear-gradient(152deg, #1c2228 0%, #191a1f 48%, #1d1a1f 76%, #121316 100%);
}
/* The one edge an icon is allowed: a hairline of light along the top, because
   a physical plate catches the light on its upper rim. */
.plate::after {
  content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.75), inset 0 0 0 1px rgba(18, 20, 24, 0.035);
}
.plate-dark::after { box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
.plate-volume::after { box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.85), inset 0 -14px 22px -14px rgba(74,94,122,0.38), inset 0 0 0 1px rgba(18,20,24,0.05); }

.disc { position: absolute; z-index: 1; border-radius: 50%; background: #1a1c1e;
  --disc-lift: translateZ(0); transform: var(--disc-lift); }
.plate-dark .disc { background: #f8f9fb; }

/* The wordmark, set in Exposure — the variable face already in this project —
   with a weight DISTRIBUTION across the letters rather than one weight. Its
   EXPO axis runs -100 (inked, counters closing) to +100 (burnt away); the ramp
   below keeps the terminals crisp and lets the middle of the word swell. */
.fog {
  /* BEHIND THE LETTER (z-index 1, under .mark's 2). It used to be 3 — in
     front — so every bank of vapour crossed the strokes and the letter
     arrived soft at every size. Air in front of the subject is a photograph
     of weather; an icon is a symbol, and a symbol's figure is never veiled.
     The bank still reads as air because it passes between the sky and the
     letter, which is also what a real cloud does behind a near object. */
  position: absolute; inset: -14%; z-index: 1; pointer-events: none;
  transform: rotate(-3deg);
  /* Softer than the letter's own strokes, so it has no edge to notice. */
  filter: blur(14px);
  background:
    radial-gradient(46% 13% at 48% 60%, rgba(255,255,255,0.66) 0%, rgba(255,255,255,0.22) 56%, rgba(255,255,255,0) 82%),
    radial-gradient(30% 9% at 33% 51%, rgba(255,255,255,0.44) 0%, rgba(255,255,255,0) 84%),
    radial-gradient(26% 8% at 70% 56%, rgba(255,255,255,0.38) 0%, rgba(255,255,255,0) 84%),
    radial-gradient(38% 11% at 57% 70%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 82%);
}

.mark {
  position: relative; z-index: 2; margin: 0; display: flex; align-items: baseline;
  font-family: "Exposure VAR", Georgia, serif; font-weight: 400;
  color: #fdfdff; line-height: 0.9; letter-spacing: -0.004em; white-space: nowrap;
  /* Height from a vertical scale, not from font-size: the stroke weights the
     ramp sets stay exactly as authored while the mark grows taller. --mark-lift
     and --mark-slant are slots, so nothing else has to touch `transform`. */
  --mark-lift: translateZ(0);
  --mark-slant: skewX(0deg);
  transform: var(--mark-lift) scaleY(1.16) var(--mark-slant); transform-origin: 50% 62%;
}
.mark > span { display: inline-block; white-space: pre; }
.mark-serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
/* An oblique, not a synthesised italic: the face has no italic, and the
   browser's fake one shears the horizontals too. */
.mark-oblique { --mark-slant: skewX(-11deg); letter-spacing: 0.008em; }
.mark-oblique > span { transform: skewX(1.5deg); }
.plate-dark .mark { color: #17181b; }

/* ── PAGE FURNITURE ─────────────────────────────────────────────────────── */
.row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.grid { display: grid; gap: 20px; }
.cap {
  display: flex; flex-direction: column; gap: 11px; min-width: 0; padding: 16px;
  border-radius: var(--radius-2xl); background: var(--surface-raised); box-shadow: var(--shadow-ring);
}
.eyebrow { font: var(--type-meta-medium); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-quaternary); }
.stage {
  position: relative; border-radius: var(--radius-xl); background: var(--background);
  box-shadow: var(--shadow-inset-ring); overflow: hidden;
}
.note { font: var(--type-meta); color: var(--text-muted); text-wrap: pretty; }
.mono { font-family: var(--font-mono); font-size: 11px; color: var(--text-disabled); }

/* ── CAPABILITY: the variable axis ──────────────────────────────────────── */
.expo { font-family: "Exposure VAR", Georgia, serif; font-size: 72px; line-height: 1; color: var(--text-primary); display: flex; gap: 0.01em; cursor: default; }
.expo span { display: inline-block; white-space: pre; font-variation-settings: "EXPO" 0; }

/* ── CAPABILITY: 3D parallax ────────────────────────────────────────────── */
.tilt { perspective: 900px; display: grid; place-items: center; }
.tilt-in { transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1); will-change: transform; }
.tilt-in .disc { --disc-lift: translateZ(26px); }
.tilt-in .mark { --mark-lift: translateZ(52px); }

/* ── CAPABILITY: motion ─────────────────────────────────────────────────── */
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
.breathing { animation: breathe 5.2s cubic-bezier(0.37, 0, 0.63, 1) infinite; }
/* ── THE SAME SKY, AT LANDING SIZE ─────────────────────────────────────── */
.hero {
  position: relative; overflow: hidden; isolation: isolate;
  border-radius: var(--radius-2xl);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.8), inset 0 0 0 1px rgba(18,20,24,0.05),
    0 18px 44px -22px rgba(24,36,52,0.3);
}
.hero-sky {
  position: absolute; inset: -8%; z-index: 0;
  background:
    /* the sun, upper right, behind everything */
    radial-gradient(38% 58% at 82% 4%, rgba(255,248,232,0.9) 0%, rgba(255,248,232,0) 60%),

    /* the near bank: four big masses, none the same size or height */
    radial-gradient(22% 30% at 14% 74%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.4) 54%, rgba(255,255,255,0) 78%),
    radial-gradient(27% 38% at 33% 80%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.46) 52%, rgba(255,255,255,0) 76%),
    radial-gradient(19% 26% at 49% 71%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.36) 54%, rgba(255,255,255,0) 80%),
    radial-gradient(24% 33% at 68% 78%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.4) 53%, rgba(255,255,255,0) 77%),
    radial-gradient(17% 24% at 86% 74%, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0.32) 55%, rgba(255,255,255,0) 80%),

    /* the middle distance: smaller, higher, weaker */
    radial-gradient(12% 15% at 24% 56%, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0) 78%),
    radial-gradient(15% 18% at 57% 52%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 76%),
    radial-gradient(10% 13% at 76% 58%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 80%),

    /* far off, just above the horizon: size is distance */
    radial-gradient(7% 5% at 40% 45%, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 82%),
    radial-gradient(6% 4% at 65% 43%, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0) 82%),
    radial-gradient(5% 3.5% at 14% 47%, rgba(255,255,255,0.52) 0%, rgba(255,255,255,0) 84%),

    /* the flat, cool bases — what makes a cumulus a solid with a bottom */
    radial-gradient(24% 9% at 14% 86%, rgba(122,152,188,0.62) 0%, rgba(122,152,188,0) 74%),
    radial-gradient(29% 11% at 33% 93%, rgba(122,152,188,0.66) 0%, rgba(122,152,188,0) 72%),
    radial-gradient(20% 8% at 49% 83%, rgba(122,152,188,0.56) 0%, rgba(122,152,188,0) 74%),
    radial-gradient(25% 10% at 68% 91%, rgba(122,152,188,0.6) 0%, rgba(122,152,188,0) 73%),

    /* haze ABOVE the horizon, where distance thins the blue — it sits behind
       the near clouds, never over them */
    linear-gradient(180deg, rgba(255,255,255,0) 28%, rgba(246,250,254,0.62) 47%, rgba(255,255,255,0) 56%),

    /* the base stays BLUE through the cloud band, so the masses have something
       to be lighter than; the warm stop is a horizon line, not the floor */
    linear-gradient(178deg,
      #8fc0e8 0%,
      #a6cdec 22%,
      #bcd9f2 38%,
      #f4efe4 47%,
      #c3dcf2 54%,
      #a9cfec 72%,
      #93c1e6 100%);
}
/* The air in front, at landing scale: wider banks, blurred far past the
   letter's strokes so it is never a shape. */
.hero-fog {
  position: absolute; inset: -12%; z-index: 4; pointer-events: none;
  transform: rotate(-1.6deg); filter: blur(30px);
  background:
    radial-gradient(30% 9% at 44% 44%, rgba(255,255,255,0.66) 0%, rgba(255,255,255,0.2) 56%, rgba(255,255,255,0) 80%),
    radial-gradient(20% 6.5% at 71% 40%, rgba(255,255,255,0.46) 0%, rgba(255,255,255,0) 82%),
    radial-gradient(23% 7% at 20% 39%, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0) 82%);
}
@keyframes hero-sky-drift {
  0%   { transform: translate3d(-2.2%, -0.8%, 0) scale(1.06); }
  50%  { transform: translate3d(2.2%, 0.6%, 0) scale(1.1); }
  100% { transform: translate3d(-2.2%, -0.8%, 0) scale(1.06); }
}
@keyframes hero-fog-drift {
  0%   { transform: rotate(-1.6deg) translate3d(4%, 0.8%, 0); }
  50%  { transform: rotate(-1.6deg) translate3d(-4%, -0.6%, 0); }
  100% { transform: rotate(-1.6deg) translate3d(4%, 0.8%, 0); }
}
.hero-sky { animation: hero-sky-drift 58s cubic-bezier(0.37, 0, 0.63, 1) infinite; will-change: transform; }
.hero-fog { animation: hero-fog-drift 31s cubic-bezier(0.37, 0, 0.63, 1) infinite; will-change: transform; }
.hero-body { position: relative; z-index: 3; }
@media (prefers-reduced-motion: reduce) { .hero-sky, .hero-fog { animation: none; } }

/* The drifting variant. The layer is oversized and offset, so at no point in
   the cycle does its own boundary enter the plate. */
@keyframes sky-drift {
  0%   { transform: translate3d(-3.5%, -1.6%, 0) scale(1.16); }
  50%  { transform: translate3d(3.5%, 1.2%, 0) scale(1.2); }
  100% { transform: translate3d(-3.5%, -1.6%, 0) scale(1.16); }
}
/* Counter to the sky, and quicker: near air moves faster than far air, and
   that difference is what makes the pair read as depth. */
@keyframes fog-drift {
  0%   { transform: rotate(-3deg) translate3d(6%, 1.4%, 0); }
  50%  { transform: rotate(-3deg) translate3d(-6%, -1.2%, 0); }
  100% { transform: rotate(-3deg) translate3d(6%, 1.4%, 0); }
}
.plate-live .plate-light {
  inset: -18%;
  animation: sky-drift 34s cubic-bezier(0.37, 0, 0.63, 1) infinite;
  will-change: transform;
}
.plate-live .fog {
  animation: fog-drift 19s cubic-bezier(0.37, 0, 0.63, 1) infinite;
  will-change: transform;
}

@media (prefers-reduced-motion: reduce) {
  .breathing, .tilt-in { animation: none; transition: none; }
  /* Weather is state, not information: with motion off it simply stands
     still, at the position the static plate has always used. */
  .plate-live .plate-light, .plate-live .fog { animation: none; }
  .plate-live .plate-light { inset: 0; }
}
</style>

<script>
/* THE SILHOUETTE, FROM THE FORMULA.
 *
 * Parametric superellipse, normalised into a 0–100% polygon so it can be a
 * clip-path on any size. 192 points is past the threshold where the polygon is
 * distinguishable from the curve at icon scale, and cheap enough to apply to
 * every plate on the page. */
function squircle(n, ratio, steps) {
  const r = (ratio == null ? 0.2237 : ratio) * 100;
  const k = steps || 26;
  const pts = [];
  /* One corner, as a quarter superellipse in an r×r box. `fromX` says which
     axis the sweep STARTS on, so consecutive corners join instead of each
     restarting from the horizontal. */
  function corner(cx, cy, sx, sy, fromX) {
    for (let i = 0; i <= k; i++) {
      const t = (i / k) * (Math.PI / 2);
      const a = Math.pow(Math.cos(t), 2 / n);
      const b = Math.pow(Math.sin(t), 2 / n);
      const x = cx + sx * r * (fromX ? a : b);
      const y = cy + sy * r * (fromX ? b : a);
      pts.push(x.toFixed(2) + "% " + y.toFixed(2) + "%");
    }
  }
  corner(100 - r, r, 1, -1, true);      /* right edge → top edge */
  corner(r, r, -1, -1, false);          /* top edge → left edge */
  corner(r, 100 - r, -1, 1, true);      /* left edge → bottom edge */
  corner(100 - r, 100 - r, 1, 1, false);/* bottom edge → right edge */
  return "polygon(" + pts.join(",") + ")";
}
const SQ = squircle(5);

/* One icon, built from four numbers: how big, how much of it the disc takes,
   where the disc sits, and what the wordmark says. Every variant below is a
   different set of those four — which is the point of having a system rather
   than five drawings. */
function icon(o) {
  const s = o.size;
  const d = s * (o.disc == null ? 0.755 : o.disc);
  const el = document.createElement("div");
  el.className = "plate" + (o.dark ? " plate-dark" : "")
    + (o.sky ? " plate-" + o.sky : "") + (o.cloud ? " plate-cloud" : "")
    + (o.live ? " plate-live" : "") + (o.cls ? " " + o.cls : "");
  el.style.width = s + "px";
  el.style.clipPath = SQ;
  el.style.borderRadius = (s * 0.02) + "px";
  el.style.boxShadow = o.flat ? "none"
    : "0 " + (s * 0.026) + "px " + (s * 0.062) + "px rgba(18,20,24,0.10), 0 " + (s * 0.007) + "px " + (s * 0.016) + "px rgba(18,20,24,0.07)";

  const light = document.createElement("span");
  light.className = "plate-light";
  el.appendChild(light);

  const disc = document.createElement("span");
  disc.className = "disc";
  if (o.noDisc) disc.style.display = "none";
  disc.style.width = d + "px";
  disc.style.height = d + "px";
  disc.style.left = ((s - d) / 2 + s * (o.dx || 0)) + "px";
  disc.style.top = ((s - d) / 2 + s * (o.dy || 0)) + "px";
  if (o.ring) {
    /* An aperture, not a dot: the disc becomes a ring and the wordmark sits in
       the opening. Drawn with a border rather than a second circle, so the
       opening is genuinely the plate showing through. */
    disc.style.background = "transparent";
    disc.style.border = (d * o.ring) + "px solid " + (o.dark ? "#f7f8fa" : "#131316");
    disc.style.boxSizing = "border-box";
  }
  el.appendChild(disc);

  const mark = document.createElement("p");
  mark.className = "mark" + (o.oblique ? " mark-oblique" : "") + (o.face === "serif" ? " mark-serif" : "");
  mark.style.fontSize = (s * (o.type == null ? 0.30 : o.type)) + "px";
  /* The nudge goes in the lift slot, so it composes with the height scale and
     the slant instead of replacing them. */
  if (o.mx || o.my) {
    mark.style.setProperty("--mark-lift", "translate(" + (s * (o.mx || 0)) + "px," + (s * (o.my || 0)) + "px)");
  }
  if (o.ink) mark.style.color = o.ink;
  if (o.cloud) mark.style.textShadow = "0 1px 0 rgba(255,255,255,0.55)";
  /* The ramp: crisp at the ends, inked through the middle. Words shorter or
     longer than five letters are sampled from the same curve, so a monogram
     and a full name are the same idea at two lengths. */
  const word = o.word == null ? "Needt" : o.word;
  const ramp = o.ramp || [-4, -22, -34, -24, -6];
  word.split("").forEach(function (ch, i) {
    const g = document.createElement("span");
    const p = word.length === 1 ? 0.5 : i / (word.length - 1);
    const at = p * (ramp.length - 1);
    const lo = Math.floor(at), hi = Math.min(lo + 1, ramp.length - 1);
    const v = ramp[lo] + (ramp[hi] - ramp[lo]) * (at - lo);
    g.style.fontVariationSettings = '"EXPO" ' + v.toFixed(1);
    g.textContent = ch;
    mark.appendChild(g);
  });
  el.appendChild(mark);

  if (o.fog) {
    const fog = document.createElement("span");
    fog.className = "fog";
    el.appendChild(fog);
  }

  if (!o.ring) {
    const authored = parseFloat(mark.style.fontSize);
    const fit = function () {
      /* Back to the authored size first — the loop only shrinks, so without
         this a re-run compounds instead of correcting. */
      mark.style.fontSize = authored + "px";
      const pb = el.getBoundingClientRect();
      const db = disc.getBoundingClientRect();
      if (!db.width) return;
      const cx = db.left - pb.left + db.width / 2;
      const cy = db.top - pb.top + db.height / 2;
      const r = db.width / 2;
      for (let pass = 0; pass < 8; pass++) {
        const mb = mark.getBoundingClientRect();
        const mx0 = mb.left - pb.left, mx1 = mb.right - pb.left;
        const my0 = mb.top - pb.top, my1 = mb.bottom - pb.top;
        /* The row of the mark where the circle is narrowest. */
        const dy = Math.max(Math.abs(my0 - cy), Math.abs(my1 - cy));
        if (dy >= r) { mark.style.fontSize = (parseFloat(mark.style.fontSize) * 0.9) + "px"; continue; }
        const half = Math.sqrt(r * r - dy * dy);
        const need = Math.max(cx - mx0, mx1 - cx);
        if (need <= half - s * 0.012) break;
        mark.style.fontSize = (parseFloat(mark.style.fontSize) * Math.max(0.8, (half - s * 0.012) / need)) + "px";
      }
    };
    /* Run it, and run it again once the faces are in — the routine restores
       the authored size first, so a re-run corrects instead of compounding.
       Nothing here waits for a frame. */
    measure(fit);
    FACES.then(fit);
    if (document.fonts && document.fonts.addEventListener) {
      document.fonts.addEventListener("loadingdone", fit);
    }
  }

}

})();

/* (c) The reach. */
(function () {
  const box = stC;
  let from = { x: 150, y: 92 }, to = { x: 150, y: 92 }, ctrl = null, t0 = 0, ms = 0, side = -1;
  hand.style.transform = "translate3d(150px,92px,0)";
  function ease(t) { return t * t * t * (10 + t * (-15 + 6 * t)); }
  box.addEventListener("pointerdown", function (e) {
    const r = box.getBoundingClientRect();
    const target = { x: e.clientX - r.left, y: e.clientY - r.top };
    const dx = target.x - from.x, dy = target.y - from.y, len = Math.hypot(dx, dy) || 1;
    side = -side;
    const bow = Math.min(len * 0.11, 40) * side;
    ctrl = { x: from.x + dx / 2 + (-dy / len) * bow, y: from.y + dy / 2 + (dx / len) * bow };
    to = target;
    ms = Math.max(300, Math.min(760, 210 + 190 * Math.log2(len / 90 + 1)));
    t0 = 0;
    tpath.setAttribute("d", "M " + from.x + " " + from.y + " Q " + ctrl.x + " " + ctrl.y + " " + to.x + " " + to.y);
    tpath.setAttribute("opacity", "0.45");
    requestAnimationFrame(step);
  });
  function step(now) {
    if (!t0) t0 = now;
    const p = Math.min((now - t0) / ms, 1), e = ease(p), u = 1 - e;
    const x = u * u * from.x + 2 * u * e * ctrl.x + e * e * to.x;
    const y = u * u * from.y + 2 * u * e * ctrl.y + e * e * to.y;
    hand.style.transform = "translate3d(" + x + "px," + y + "px,0)";
    if (p < 1) return requestAnimationFrame(step);
    from = { x: to.x, y: to.y };
    /* The path fades after it lands: it is evidence of the trip, not decoration
       that accumulates. */
    tpath.style.transition = "opacity 0.9s ease";
    tpath.setAttribute("opacity", "0");
    window.setTimeout(function () { tpath.style.transition = ""; }, 950);
  }
})();

/* (e) The tilt. */
(function () {
  stE.addEventListener("pointermove", function (e) {
    const r = stE.getBoundingClientRect();
    const nx = (e.clientX - r.left) / r.width - 0.5, ny = (e.clientY - r.top) / r.height - 0.5;
    tiltIn.style.transition = "none";
    tiltIn.style.transform = "rotateY(" + (nx * 26).toFixed(2) + "deg) rotateX(" + (-ny * 26).toFixed(2) + "deg)";
  });
  stE.addEventListener("pointerleave", function () {
    tiltIn.style.transition = "transform 0.5s cubic-bezier(0.2,0.7,0.2,1)";
    tiltIn.style.transform = "none";
  });
})();
</script>
