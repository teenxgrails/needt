<style>
/* An outline glyph inside a filled tile runs heavier than it does in a nav
   row, so project marks and source marks read at the same weight. */
.rb-tile-glyph svg { stroke-width: 2.5; }
.rb-entry {
  color: var(--text-primary);
  background: var(--surface-raised);
  box-shadow: var(--shadow-raised);
  transition: box-shadow 0.15s ease, background-color 0.15s ease, color 0.15s ease;
}
.rb-entry .rb-arrow { color: var(--rb-ink); transition: color 0.15s ease, transform 0.15s ease; }
.rb-entry .rb-cost { color: var(--text-tertiary); transition: color 0.15s ease; }
.rb-entry .rb-rest { opacity: 1; transition: opacity 0.15s ease; }
.rb-entry .rb-hot { opacity: 0; transition: opacity 0.15s ease; }
.rb-entry:hover {
  background: color-mix(in oklab, var(--accent) 12%, var(--surface-raised));
  color: var(--accent);
  box-shadow: var(--shadow-raised-hover);
}
.rb-entry:hover .rb-arrow { color: var(--accent); transform: translateX(2px); }
.rb-entry:hover .rb-cost { color: color-mix(in oklab, var(--accent) 70%, var(--text-tertiary)); }
.rb-entry:hover .rb-rest { opacity: 0; }
.rb-entry:hover .rb-hot { opacity: 1; }
.rb-entry:active { box-shadow: var(--shadow-inset-ring); }
@media (prefers-reduced-motion: reduce) {
  .rb-entry, .rb-entry * { transition: none; }
  .rb-entry:hover .rb-arrow { transform: none; }
}
html,body{height:100%}body{margin:0;overflow:auto;background:var(--background)}#root{width:100%}</style>
