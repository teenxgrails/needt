<style>
html,body{height:100%;margin:0;background:#F4F7FB;overflow:auto}#root{width:100%}
/* Bare: whoever embeds it owns the ground as well as the frame. */
html.bare,html.bare body{background:transparent;overflow:hidden}
/* The engine's shell: its own dark ground and padding, neither of which is
   ours — selected by structure because it carries no class to name. */
html.bare #root>div{background:transparent !important;padding:0 !important}
/* Its transport — the clock and the scrubber — is the last child of that
   shell. A looping, un-operable film has nothing for either to do. */
html.bare #root>div>div:last-child{display:none !important}
</style>
