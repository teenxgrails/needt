<style>
html,body{height:100%}body{margin:0;overflow:auto;background:var(--background)}#root{width:1440px}
/* Motion the sheet has to carry, because the specimens are the real objects. */
@keyframes needt-flame-body {
  0%   { transform: translateX(-50%) scale(1, 1) skewX(0deg); }
  30%  { transform: translateX(-50%) scale(0.95, 1.09) skewX(-5deg); }
  60%  { transform: translateX(-50%) scale(1.04, 0.95) skewX(4deg); }
  100% { transform: translateX(-50%) scale(0.99, 1.03) skewX(-2deg); }
}
@keyframes needt-flame-core {
  0%   { transform: translateX(-50%) scale(1, 0.93) skewX(2deg); opacity: 0.85; }
  45%  { transform: translateX(-50%) scale(0.91, 1.13) skewX(-6deg); opacity: 1; }
  100% { transform: translateX(-50%) scale(1.06, 0.96) skewX(3deg); opacity: 0.9; }
}
.flame { position: relative; display: inline-block; aspect-ratio: 0.66; flex: none; vertical-align: -2px; }
.flame i { position: absolute; left: 50%; bottom: 0; display: block; transform-origin: 50% 100%; transform: translateX(-50%);
  clip-path: polygon(50% 0%, 60% 15%, 70% 30%, 80% 48%, 84% 66%, 78% 85%, 62% 100%, 38% 100%, 22% 85%, 16% 66%, 20% 48%, 30% 30%, 40% 15%); }
.flame i:nth-child(1) { width: 100%; height: 100%; background: linear-gradient(to top, rgba(var(--accent-rgb), 0.5), rgba(var(--accent-rgb), 0.07) 90%); animation: needt-flame-body 1.25s ease-in-out infinite; }
.flame i:nth-child(2) { width: 58%; height: 60%; background: linear-gradient(to top, rgba(var(--accent-rgb), 0.98), rgba(var(--accent-rgb), 0.32)); animation: needt-flame-core 0.78s ease-in-out infinite; }
.flame i:nth-child(3) { width: 26%; height: 28%; background: var(--surface-raised); opacity: 0.7; animation: needt-flame-core 0.55s ease-in-out infinite reverse; }
@keyframes needt-count-bump { 0% { transform: scale(1); } 35% { transform: scale(1.18); background: var(--fill-accent); color: var(--accent); } 100% { transform: scale(1); } }
.count-bump { animation: needt-count-bump 0.32s ease; }
@keyframes needt-drop-in { from { opacity: 0; transform: scaleY(0.9); } to { opacity: 1; transform: none; } }
.drop-preview { display: flex; align-items: center; gap: 6px; padding: 0 8px; pointer-events: none; overflow: hidden;
  border-radius: var(--radius-md); background: var(--fill-accent); color: var(--accent);
  box-shadow: rgba(var(--accent-rgb), 0.55) 0 0 0 1.5px inset; transform-origin: 50% 0; animation: needt-drop-in 0.14s ease both; }
.drop-preview-no { background: var(--fill-destructive); color: var(--destructive); box-shadow: none; outline: 1.5px dashed var(--destructive); outline-offset: -1.5px; }
@keyframes needt-breathe {
  0%   { transform: skewX(0deg) scale(1, 1);          letter-spacing: -0.014em; }
  38%  { transform: skewX(-6deg) scale(1.06, 1.045);  letter-spacing: 0.012em; }
  56%  { transform: skewX(-7deg) scale(1.075, 1.05);  letter-spacing: 0.016em; }
  78%  { transform: skewX(-2deg) scale(0.995, 1.005); letter-spacing: -0.006em; }
  100% { transform: skewX(0deg) scale(1, 1);          letter-spacing: -0.014em; }
}
.needt-mark { cursor: default; transition: transform 0.32s cubic-bezier(0.2,0.7,0.2,1), letter-spacing 0.32s cubic-bezier(0.2,0.7,0.2,1); }
.needt-mark.is-breathing { animation: needt-breathe 5.2s cubic-bezier(0.37,0,0.63,1) infinite; }
.needt-mark:hover { animation-play-state: paused; transform: scale(1.075, 1.05); letter-spacing: 0.018em; }
.reveal-on-hover { opacity: 0; transition: opacity var(--transition-hover); }
.group:hover .reveal-on-hover { opacity: 1; }
.just-landed > * { animation: needt-drop-in 0.32s cubic-bezier(0.2,0.7,0.2,1) both; }
/* A frame with a transform is a containing block, so a position:fixed specimen
   (the drag ghost, a dialog scrim) stays inside its card instead of the page. */
.stage { position: relative; transform: translateZ(0); overflow: hidden; border-radius: var(--radius-xl);
  background: var(--background); box-shadow: var(--shadow-ring); }
@media (prefers-reduced-motion: reduce) { .flame i, .count-bump, .drop-preview, .needt-mark, .just-landed > * { animation: none; } }
</style>

<script type="text/babel">
/* THE OBJECT INVENTORY
 *
 * Not a gallery of ideas — a parts list. One entry per object the product
 * draws, every state it has, and the prop that produces each state, so the
 * move into code is a lookup rather than a hunt through screens. Every
 * specimen is the real component: change the component and this page changes.
 * A motif table at the end names each animation with its duration, curve and
 * trigger, because twenty animations without a table get reinvented by eye. */
const NS = window.NeedtDesignSystem_25d3c8;
const { Card, ToggleGroup, Chip, Icon, Button, IconButton, EmptyState, SidebarHint, Menu, MenuItem, MenuLabel, MenuSeparator, Checkbox, Tooltip, StatusDot, Skeleton, SkeletonRows } = NS;

/* ── The sheet furniture ────────────────────────────────────────────────── */
function Props({ items }) {
  if (!items) return null;
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: "3px 8px" }}>
      {items.map((p) => (
        <span key={p} style={{ fontFamily: "var(--font-mono)", fontSize: 11, lineHeight: "16px", color: "var(--text-quaternary)" }}>{p}</span>
      ))}
    </div>
  );
}

function Spec({ name, note, props, width, height, pad, children }) {
  return (
    <section style={{ display: "flex", flexDirection: "column", gap: 6, width: width || "auto" }}>
      <span style={{ font: "var(--type-ui-medium)", color: "var(--text-primary)" }}>{name}</span>
      {note ? <span style={{ font: "var(--type-meta)", color: "var(--text-muted)", textWrap: "pretty" }}>{note}</span> : null}
      <div className="stage" style={{ padding: pad == null ? 11 : pad, minHeight: height || 64, display: "flex", alignItems: "center" }}>{children}</div>
      <Props items={props} />
    </section>
  );
}

function Sheet({ n, title, note, children }) {
  return (
    <section style={{ display: "flex", flexDirection: "column", gap: 16, paddingTop: 32 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 11 }}>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--text-disabled)" }}>{n}</span>
        <h2 style={{ margin: 0, font: "var(--type-page-title)", color: "var(--text-primary)" }}>{title}</h2>
        <span style={{ font: "var(--type-meta)", color: "var(--text-muted)", textWrap: "pretty", maxWidth: 620 }}>{note}</span>
      </div>
      {children}
    </section>
  );
}

function Row({ children, cols }) {
  return <div style={{ display: "grid", gridTemplateColumns: cols || "repeat(auto-fit, minmax(300px, 1fr))", gap: 20, alignItems: "start" }}>{children}</div>;
}

/* ── The data every sheet draws from ───────────────────────────────────── */
const GRID = { hourH: 46 };
const B_TASK = { kind: "task", title: "Draft the launch brief", time: "09:30–11:00", start: 9.5, end: 11, movable: true, project: "ops", priority: "high", parts: { closed: 1, total: 3 }, entry: "Pull last month's numbers", heat: 0.7 };
const B_PLAIN = { kind: "task", title: "Write the weekly review", time: "09:00–10:00", start: 9, end: 10, movable: true, project: "ds" };
const B_FIXED = { kind: "task", title: "Send the print files", time: "13:00–13:30", start: 13, end: 13.5, project: "ops" };
const B_OVERDUE = { kind: "task", title: "Reply to counsel", time: "11:00–11:30", start: 11, end: 11.5, movable: true, overdue: true, project: "ops" };
const B_SHORT = { kind: "task", title: "Book the dentist", time: "16:00–16:15", start: 16, end: 16.25, movable: true, parts: { closed: 0, total: 2 } };
const B_EVENT = { kind: "event", title: "1:1 Anna", time: "15:00–15:45", start: 15, end: 15.75, calendar: "work" };
const B_EXTERNAL = { kind: "task", title: "Check emails", time: "09:00–09:30", start: 9, end: 9.5, source: "google", calendar: "work" };

const T_PARTS = { id: 1, title: "Draft the launch brief", project: "Operations", due: "4 Sep", est: 90, done: false,
  parts: [{ title: "Pull last month's numbers", done: true }, { title: "Write the draft", done: false }, { title: "Send it for review", done: false }] };
const T_PLAIN = { id: 2, title: "Confirm the courier", project: "Operations", due: "5 Sep", est: 20, done: false };
const T_DONE = { id: 3, title: "Book the dentist", est: 15, done: true };
const T_OVERDUE = { id: 4, title: "Reply to counsel", due: "1 Sep", est: 30, done: false, overdue: true };
const T_MONEY = { id: 5, title: "Arc'teryx shell — L", project: "Resale", value: 4200, done: false, noSlot: true,
  parts: [{ title: "Photograph it", done: true }, { title: "List it", done: true }, { title: "Ship it", done: false }] };

/* compact is a PIXEL rule, not a duration rule — the same one the day grid and
   the week columns use: under 40px there is no room for a second line. Deriving
   it here from the computed height keeps the sheet honest as a contract. */
function Block1({ b, w, hours }) {
  const B = window.Block;
  const h = blockHeight(hours == null ? (b.end - b.start) : hours, GRID.hourH);
  return (
    <div style={{ position: "relative", width: w || 260, height: h }}>
      <B b={b} railBy="movability" compact={h < 40} onToggle={() => {}} />
    </div>
  );
}

/* ── A — blocks on the grid ─────────────────────────────────────────────── */
function SheetBlocks() {
  return (
    <Sheet n="A" title="Blocks on the grid" note="The object every time surface draws. The project owns the hue, so the colour is the person's own data; the edge carries movability, which had to move somewhere when colour took the body; the tile says where the block came from.">
      <Row>
        <Spec name="Block" note="Body in the project's hue, tile in the top left, time under the title." props={["b.kind='task'", "b.movable", "b.project", "b.priority='high' → rail 6px", "railBy='movability'|'urgency'"]} height={96}><Block1 b={B_PLAIN} /></Spec>
        <Spec name="With parts" note="The counter appears where the parts themselves are not — on the grid there is no room to list them." props={["b.parts={closed,total}", "divided = !compact"]} height={96}><Block1 b={{ kind: "task", title: "Print files to the factory", time: "10:00–11:30", start: 10, end: 11.5, movable: true, project: "ops", parts: { closed: 1, total: 4 } }} /></Spec>
        <Spec name="Entry and flame" note="The two-minute step the task opens with, plus its category's flame — both on the block, where the day is read." props={["b.entry", "b.heat 0…1 → 15…22px", "shown when duration ≥ 0.75h"]} height={110}><Block1 b={B_TASK} /></Spec>
        <Spec name="Fixed — it wears a hairline edge" note="Pinned by you, so the scheduler may not move it: the edge says so at every height, and the tile carries a lock." props={["b.movable=false"]} height={96}><Block1 b={B_FIXED} /></Spec>
        <Spec name="Overdue — the hue goes destructive" note="Red means one thing — this must not slip — and a line in words says which: late, or held." props={["b.overdue=true"]} height={96}><Block1 b={B_OVERDUE} /></Spec>
        <Spec name="Compressed — two lines" note="Below 56px the block keeps its title and its time, centred against the tile, and drops everything else." props={["blockHeight(…) < 40 → compact", "b.parts={closed,total}"]} height={96}><Block1 b={B_SHORT} /></Spec>
        <Spec name="Event — its calendar owns the hue" note="An event has no project, so its calendar owns the hue and its source owns the tile: the same two slots, different owners." props={["b.kind='event'", "b.calendar='work'|'personal'|'family'"]} height={96}><Block1 b={B_EVENT} /></Spec>
        <Spec name="External task" note="A 6px source mark, not a logo: where it came from is a fact about the block." props={["b.source='google'|'apple'|'linear'"]} height={96}><Block1 b={B_EXTERNAL} /></Spec>
        <Spec name="Parts counter" note="Shown only when the list of parts is not — a count of things you can see is a count of nothing." props={["b.parts.closed", "b.parts.total"]} height={64}>
          <span style={{ display: "flex", gap: 11 }}>
            <PartCount b={{ parts: { closed: 1, total: 3 } }} />
            <PartCount b={{ parts: { closed: 2, total: 2 } }} />
          </span>
        </Spec>
        <Spec name="EmptyBlock" note="A slot with nothing in it. Recessed, never raised." props={["—"]} height={64}><div style={{ width: 260, height: 40 }}><EmptyBlock /></div></Spec>
      </Row>
    </Sheet>
  );
}

/* ── B — list rows and parts ────────────────────────────────────────────── */
function SheetRows() {
  const [tasks, setTasks] = React.useState([T_PARTS, T_PLAIN, T_OVERDUE, T_DONE, T_MONEY]);
  function toggle(id) { setTasks((l) => l.map((t) => (t.id === id ? Object.assign({}, t, { done: !t.done }) : t))); }
  function togglePart(id, i) {
    setTasks((l) => l.map((t) => (t.id === id && t.parts
      ? Object.assign({}, t, { parts: t.parts.map((p, j) => (j === i ? Object.assign({}, p, { done: !p.done }) : p)) }) : t)));
  }
  return (
    <Sheet n="B" title="List rows and parts" note="36px row on a hairline, transparent at rest, actions revealed on hover. Parts are always visible as nested rows hanging off a hairline — the task is its pieces, not a disclosure. Click a checkbox: the counter flashes once.">
      <Row cols="minmax(0,1fr) 300px">
        <Spec name="TaskRow — live" note="Variant C, the table: 36px on hairlines with named columns, so every date sits under Due and every amount under Value. Hover for actions, right-click for the menu, click a part's arrow to promote it into a task of its own." pad={8}
          props={["TASK_COLS = 28px 1fr 148px 96px 76px 88px", "task.parts[]", "task.value", "task.noSlot", "task.overdue", "task.status", "task.done", "onToggle", "onTogglePart", "onPromotePart", "onOpen", "dragProps"]}>
          <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
            <TaskTableHead />
            {tasks.map((t) => <TaskRow key={t.id} task={t} onToggle={toggle} onOpen={() => {}} onTogglePart={togglePart} onPromotePart={() => {}} />)}
          </div>
        </Spec>
        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          <Spec name="Counter" note="Muted while parts remain, accent when they are all closed." props={["closed/total", ".count-bump on change"]} height={56}>
            <span style={{ display: "flex", gap: 11 }}>
              <span style={{ display: "inline-flex", alignItems: "center", height: 18, padding: "0 5px", borderRadius: "var(--radius-xs)", fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--text-muted)", background: "var(--fill-3)" }}>1/3</span>
              <span style={{ display: "inline-flex", alignItems: "center", height: 18, padding: "0 5px", borderRadius: "var(--radius-xs)", fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--accent)", background: "var(--fill-accent)" }}>3/3</span>
            </span>
          </Spec>
          <Spec name="No rail" note="A task that does not belong in the day has nothing to move, so it offers no drag and says so where you would move it." props={["task.noSlot=true"]} height={56}>
            <span style={{ font: "var(--type-meta)", color: "var(--text-disabled)" }}>No slot</span>
          </Spec>
          <Spec name="Group header" note="A category states its count, its flame, and — when its tasks carry money — what it is worth with every task closed." props={["name", "count", "sum", "heat 0…1"]} height={56}>
            <span style={{ display: "flex", alignItems: "center", gap: 8, width: "100%" }}>
              <span style={{ font: "var(--type-meta-medium)", letterSpacing: "0.04em", textTransform: "uppercase", color: "var(--text-quaternary)" }}>RESALE</span>
              <Flame heat={0.7} />
              <span style={{ font: "var(--type-meta)", color: "var(--text-muted)" }}>3</span>
              <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ font: "var(--type-meta)", color: "var(--text-disabled)" }}>all closed</span>
                <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--text-secondary)" }}>€11 400</span>
              </span>
            </span>
          </Spec>
          <Spec name="Flame — the ladder" note="Height is the impulse: parts and tasks closed lately, tasks weighted double. A cold category has no flame, which is why there is no switch." props={["heat=0 → nothing", "heat=0.35", "heat=0.7", "heat=1", "min=9 max=18"]} height={56}>
            <span style={{ display: "flex", alignItems: "flex-end", gap: 16, height: 26 }}>
              <span style={{ font: "var(--type-meta)", color: "var(--text-disabled)" }}>cold</span>
              <Flame heat={0.35} /><Flame heat={0.7} /><Flame heat={1} />
              <Flame heat={1} min={20} max={38} />
            </span>
          </Spec>
        </div>
      </Row>
    </Sheet>
  );
}

/* ── C — drag states ───────────────────────────────────────────────────── */
function SheetDrag() {
  const ghost = { item: T_PARTS, x: 96, y: 74, over: { kind: "timeline", time: 10.5, date: 1 } };
  return (
    <Sheet n="C" title="Drag states" note="One gesture for the whole product: the card under the hand is the block it will become, the grid draws where it would land before the drop, and a refusal says what is in the way.">
      <Row>
        <Spec name="DragGhost" note="The real block on a spring — 0.32 of the remaining distance each frame — leaning into its own velocity. Fixed-positioned; framed here by a transformed ancestor." props={["drag.item", "drag.x/y", "drag.over", "returning={from,to}"]} height={150} pad={0}>
          <div style={{ position: "relative", width: "100%", height: 150 }}><DragGhost drag={ghost} /></div>
        </Spec>
        <Spec name="Landing" note="Accent outline at the snapped quarter hour, height from the task's estimate, its start time in mono." props={["drag.over.time → snapped", "item.est → height"]} height={150}>
          <div style={{ position: "relative", width: "100%", height: 120 }}>
            <div className="drop-preview" style={{ position: "absolute", left: 0, right: 0, top: 12, height: 66 }}>
              <span style={{ fontFamily: "var(--font-mono)", fontSize: 11 }}>10:30</span>
              <span style={{ font: "var(--type-meta)" }}>Draft the launch brief</span>
            </div>
          </div>
        </Spec>
        <Spec name="Landing refused" note="Dashed, destructive, and it names the obstacle: time already gone, or a block the scheduler may not move." props={["blockedLanding(items,start,end,now)", "→ 'Already gone' | 'Fixed: …'"]} height={150}>
          <div style={{ position: "relative", width: "100%", height: 120, display: "flex", flexDirection: "column", gap: 8 }}>
            <div className="drop-preview drop-preview-no" style={{ height: 40 }}>
              <span style={{ fontFamily: "var(--font-mono)", fontSize: 11 }}>08:15</span><span style={{ font: "var(--type-meta)" }}>Already gone</span>
            </div>
            <div className="drop-preview drop-preview-no" style={{ height: 40 }}>
              <span style={{ fontFamily: "var(--font-mono)", fontSize: 11 }}>15:00</span><span style={{ font: "var(--type-meta)" }}>Fixed: 1:1 Anna</span>
            </div>
          </div>
        </Spec>
        <Spec name="Held source" note="What the hand took is left at 35% in place, so the row never disappears from under you." props={["isDragged(drag,item) → opacity 0.35"]} height={150} pad={8}>
          <div style={{ flex: 1, opacity: 0.35 }}><TaskRow task={T_PLAIN} onToggle={() => {}} onOpen={() => {}} /></div>
        </Spec>
        <Spec name="Neighbours make room" note="Anything starting inside the landing slides down by its height, 0.18s, and slides back if the drop does not happen." props={["translateY(landing height + 4)"]} height={150}>
          <div style={{ position: "relative", width: "100%", height: 120 }}>
            <div className="drop-preview" style={{ position: "absolute", left: 0, right: 0, top: 0, height: 44 }}><span style={{ fontFamily: "var(--font-mono)", fontSize: 11 }}>10:30</span></div>
            <div style={{ position: "absolute", left: 0, right: 0, top: 52, transform: "translateY(0)" }}><Block1 b={B_EVENT} w="100%" hours={0.75} /></div>
          </div>
        </Spec>
        <Spec name="Just landed" note="On drop the block plays once and settles. Nothing loops after a drop." props={[".just-landed", "0.32s cubic-bezier(0.2,0.7,0.2,1)"]} height={150}>
          <div className="just-landed" style={{ width: "100%" }}><Block1 b={B_TASK} w="100%" hours={1} /></div>
        </Spec>
      </Row>
    </Sheet>
  );
}

function App() {
  const [theme, setTheme] = React.useState("light");
  /* The later sheets arrive in a second file, so the page re-renders when that
     file announces itself rather than racing it. */
  const [, bump] = React.useState(0);
  React.useEffect(() => {
    function ready() { bump((n) => n + 1); }
    window.addEventListener("needt-sheets", ready);
    return () => window.removeEventListener("needt-sheets", ready);
  }, []);
  return (
    <div className={"app " + (theme === "light" ? "" : theme)} style={{ minHeight: "100%", background: "var(--background)", padding: "20px 20px 60px" }}>
      <header style={{ display: "flex", alignItems: "center", gap: 16 }}>
        <ExposureWordmark size={44} mode="breathe" />
        <span style={{ font: "var(--type-meta)", color: "var(--text-muted)", maxWidth: 560, textWrap: "pretty" }}>
          Object inventory — every object the product draws, every state it has, and the prop that produces it.
        </span>
        <span style={{ marginLeft: "auto", display: "flex", gap: 11 }}>
          <ToggleGroup value={theme} onChange={setTheme} label="Theme" items={[
            { value: "light", label: "Light" }, { value: "dim", label: "Dim" }, { value: "dark", label: "Dark" }]} />
          <Button variant="flat" iconRight={<Icon name="arrow-right" size={16} />} onClick={() => { window.location.href = "index.html"; }}>Open the app</Button>
        </span>
      </header>
      <SheetBlocks />
      <SheetRows />
      <SheetDrag />
      {window.SheetStates ? <window.SheetStates /> : null}
      {window.SheetOverlays ? <window.SheetOverlays /> : null}
      {window.SheetCanvas ? <window.SheetCanvas /> : null}
      {window.SheetMotifs ? <window.SheetMotifs /> : null}
    </div>
  );
}

Object.assign(window, { Spec, Sheet, Row, Props, Block1, B_TASK, B_EVENT, T_PARTS, T_PLAIN });
const __root = document.getElementById("root");
