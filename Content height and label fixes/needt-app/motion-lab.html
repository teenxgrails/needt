<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Needt — motion prototypes</title>
<link rel="stylesheet" href="../_ds/needt-design-system-main-25d3c8e5-a812-464d-881f-e887b9adef4b/styles.css">
<link rel="stylesheet" href="themes.css?v=3">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../_ds/needt-design-system-main-25d3c8e5-a812-464d-881f-e887b9adef4b/_ds_bundle.js"></script>
<script type="module" src="needt-icons.js?v=8"></script>
<style>
html,body{height:100%;margin:0;background:var(--background);overflow:auto}#root{width:100%}

/* ── 1 · A CHIP IS RECOGNISED ───────────────────────────────────────────────
   The app just understood a word. Two candidates, and the difference is what
   they claim: A says the chip CAME FROM the word (it rises out of the line and
   settles), B says the chip WAS ALWAYS THERE and has only now been noticed. */
@keyframes m-chip-a {
  0%   { opacity: 0; transform: translateY(9px) scale(0.88); filter: blur(3px); }
  55%  { opacity: 1; transform: translateY(-2px) scale(1.03); filter: blur(0); }
  100% { opacity: 1; transform: none; }
}
.m-chip-a { animation: m-chip-a 0.42s cubic-bezier(0.2, 0.9, 0.24, 1) both; }

@keyframes m-chip-b {
  0%   { opacity: 0; transform: scale(0.6); }
  100% { opacity: 1; transform: none; }
}
@keyframes m-chip-b-ring {
  0%   { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.55); }
  100% { box-shadow: 0 0 0 9px rgba(var(--accent-rgb), 0); }
}
.m-chip-b { animation: m-chip-b 0.3s cubic-bezier(0.2, 0.9, 0.24, 1) both, m-chip-b-ring 0.6s ease-out both; }

/* The word it came from, lighting up under the text. Both candidates share it,
   because the underline is a fact about the sentence, not a style choice. */
@keyframes m-underline {
  0%   { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}
.m-underline { display: inline-block; transform-origin: 0 50%; animation: m-underline 0.3s cubic-bezier(0.2, 0.9, 0.24, 1) both; }

/* The one motion this product grants: out of nothing, into place. Shared by
   every event below, because they are all the same claim — this thing is new
   or has changed — and one claim should not have five accents. */
@keyframes m-settle {
  0%   { opacity: 0; transform: translateY(9px) scale(0.94); filter: blur(3px); }
  55%  { opacity: 1; transform: translateY(-2px) scale(1.01); filter: blur(0); }
  100% { opacity: 1; transform: none; }
}
.m-settle { animation: m-settle 0.42s cubic-bezier(0.2, 0.9, 0.24, 1) both; }

/* ── 2 · A TASK ARRIVES IN A LIST ───────────────────────────────────────────
   C: the list opens a gap and the card drops into it — the honest version,
   because the neighbours really do move. D: the card slides in from the edge
   the composer sits on, which says where it came from but lies about the gap. */
@keyframes m-task-c {
  0%   { max-height: 0; opacity: 0; transform: translateY(-6px) scale(0.98); margin-bottom: -8px; }
  40%  { max-height: 80px; opacity: 1; margin-bottom: 0; }
  100% { max-height: 80px; opacity: 1; transform: none; margin-bottom: 0; }
}
.m-task-c { animation: m-task-c 0.44s cubic-bezier(0.2, 0.8, 0.2, 1) both; overflow: hidden; }

@keyframes m-task-d {
  0%   { opacity: 0; transform: translateX(-26px) rotate(-1.4deg); }
  100% { opacity: 1; transform: none; }
}
.m-task-d { animation: m-task-d 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }

/* ── 3 · A TASK IS CLOSED ───────────────────────────────────────────────────
   E: the ring fills, the title strikes through, and the row exhales out of the
   list. F: the row lifts off toward where finished work lives, so closing is
   something you watch leave. */
@keyframes m-close-e {
  0%   { opacity: 1; }
  35%  { opacity: 1; }
  100% { opacity: 0; max-height: 0; transform: translateY(-4px); }
}
.m-close-e { animation: m-close-e 0.62s cubic-bezier(0.4, 0, 0.2, 1) both; overflow: hidden; }
@keyframes m-close-f {
  0%   { opacity: 1; transform: none; }
  100% { opacity: 0; transform: translate(38px, -22px) scale(0.94) rotate(2deg); }
}
.m-close-f { animation: m-close-f 0.5s cubic-bezier(0.4, 0, 1, 1) both; }
@keyframes m-strike { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
.m-strike { transform-origin: 0 50%; animation: m-strike 0.26s cubic-bezier(0.4, 0, 0.2, 1) both; }
@keyframes m-tick { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: none; opacity: 1; } }
.m-tick { animation: m-tick 0.3s cubic-bezier(0.2, 0.9, 0.24, 1) both; }

/* ── 4 · A PART IS CLOSED ───────────────────────────────────────────────────
   The counter is the only thing that changes, so the counter is the animation:
   the old number leaves upward and the new one arrives from below, the way a
   mechanical counter turns. */
@keyframes m-roll-out { 0% { transform: none; opacity: 1; } 100% { transform: translateY(-100%); opacity: 0; } }
@keyframes m-roll-in { 0% { transform: translateY(100%); opacity: 0; } 100% { transform: none; opacity: 1; } }
.m-roll { position: relative; display: inline-grid; overflow: hidden; height: 18px; }
.m-roll > span { grid-area: 1 / 1; }
.m-roll .out { animation: m-roll-out 0.28s cubic-bezier(0.4, 0, 0.2, 1) both; }
.m-roll .in { animation: m-roll-in 0.28s cubic-bezier(0.2, 0.9, 0.24, 1) both; }

/* ── 5 · A BLOCK IS PLACED ON THE GRID ──────────────────────────────────────
   The scheduler put it there. It does not fade in — it is set down: the block
   arrives slightly large and settles, and the hour it lands on flashes once so
   the eye is told WHERE rather than left to find it. */
@keyframes m-place {
  0%   { opacity: 0; transform: scale(1.06) translateY(-8px); }
  60%  { opacity: 1; transform: scale(0.995) translateY(1px); }
  100% { opacity: 1; transform: none; }
}
.m-place { animation: m-place 0.46s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes m-hourflash { 0% { background: rgba(var(--accent-rgb), 0.22); } 100% { background: transparent; } }
.m-hourflash { animation: m-hourflash 0.7s ease-out both; }

/* ── 6 · A HABIT IS KEPT ────────────────────────────────────────────────────
   The square fills, and the fill spreads from the middle rather than switching
   colour — a small physical event for a small physical act. */
@keyframes m-habit {
  0%   { clip-path: inset(50% 50% 50% 50% round 2px); }
  100% { clip-path: inset(0 0 0 0 round 2px); }
}
.m-habit-fill { animation: m-habit 0.34s cubic-bezier(0.2, 0.9, 0.24, 1) both; }
@keyframes m-habit-pop { 0% { transform: none; } 40% { transform: scale(1.18); } 100% { transform: none; } }
.m-habit-pop { animation: m-habit-pop 0.36s cubic-bezier(0.2, 0.9, 0.24, 1) both; }

/* ── 7 · A TAG IS TURNED ON ─────────────────────────────────────────────────
   The row of tags reflows, so the new one has to make room for itself: it
   opens its own width first and colours second, which is why nothing jumps. */
@keyframes m-tag {
  0%   { max-width: 0; opacity: 0; margin-right: 0; transform: scale(0.9); }
  45%  { max-width: 160px; opacity: 0.5; margin-right: 5px; }
  100% { max-width: 160px; opacity: 1; margin-right: 5px; transform: none; }
}
.m-tag { animation: m-tag 0.38s cubic-bezier(0.2, 0.8, 0.2, 1) both; overflow: hidden; white-space: nowrap; }

/* ── 8 · SEVERAL THINGS AT ONCE ─────────────────────────────────────────────
   Dictation, or the planner placing a day. A stagger of 55ms reads as one
   event with parts; 200ms reads as a queue being processed, which is slower to
   understand even though each item is identical. */
.m-stagger > * { animation: m-task-c 0.44s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.NeedtDesignSystem_25d3c8;
const { Icon, Button, ToggleGroup, IconButton } = NS;

function Chip({ cls, tone, glyph, children, style }) {
  return (
    <span className={cls} style={Object.assign({ display: "inline-flex", alignItems: "center", gap: 5, height: 26, padding: glyph ? "0 9px 0 8px" : "0 9px",
      borderRadius: "var(--radius-pill)", flex: "none",
      background: "color-mix(in oklab, " + tone + " 13%, var(--surface-raised))",
      boxShadow: "inset 0 0 0 1px color-mix(in oklab, " + tone + " 34%, transparent)",
      color: tone }, style)}>
      {glyph ? <Icon name={glyph} size={12} /> : null}
      <span style={{ font: "var(--type-meta-medium)", whiteSpace: "nowrap" }}>{children}</span>
    </span>
  );
}

function Card({ cls, title, meta, hue, done, strike }) {
  return (
    <article className={cls} style={{ display: "flex", alignItems: "center", gap: 9, padding: "9px 10px", borderRadius: "var(--radius-lg)",
      background: "var(--surface-raised)", boxShadow: "var(--shadow-ring)" }}>
      <span className={done ? "m-tick" : ""} style={{ flex: "none", display: "grid", placeItems: "center", width: 17, height: 17, borderRadius: 9,
        background: done ? hue : "transparent", boxShadow: done ? "none" : "inset 0 0 0 1.5px var(--text-disabled)", color: "var(--surface-raised)" }}>
        {done ? <Icon name="check" size={10} /> : null}
      </span>
      <span style={{ flex: 1, minWidth: 0, position: "relative" }}>
        <span style={{ font: "var(--type-ui-medium)", color: done ? "var(--text-muted)" : "var(--text-primary)" }}>{title}</span>
        {strike ? <span className="m-strike" style={{ position: "absolute", left: 0, right: 0, top: "50%", height: 1, background: "var(--text-muted)" }} /> : null}
      </span>
      <span style={{ flex: "none", display: "flex", alignItems: "center", gap: 7 }}>
        <span style={{ font: "var(--type-meta)", color: "var(--text-tertiary)", fontVariantNumeric: "tabular-nums" }}>{meta}</span>
        <span style={{ width: 16, height: 16, borderRadius: 5, background: hue }} />
      </span>
    </article>
  );
}

/* Each specimen replays by remount: the key changes, the element is new, the
   animation runs from its first frame. Nothing depends on a timeline the
   browser may have already finished. */
function Spec({ n, title, says, spec, children, tall }) {
  const [k, setK] = React.useState(0);
  return (
    <section style={{ display: "flex", flexDirection: "column", gap: 9, minWidth: 0 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--text-disabled)" }}>{n}</span>
        <span style={{ font: "var(--type-ui-medium)", color: "var(--text-primary)" }}>{title}</span>
        <span style={{ marginLeft: "auto" }}>
          <Button size="sm" variant="ghost" iconLeft={<Icon name="repeat" size={13} />} onClick={() => setK(k + 1)}>Replay</Button>
        </span>
      </div>
      <div style={{ display: "flex", alignItems: "center", minHeight: tall || 92, padding: 14, borderRadius: "var(--radius-xl)",
        background: "var(--background)", boxShadow: "var(--shadow-inset-ring)", overflow: "hidden" }}>
        <div key={k} style={{ width: "100%" }}>{children}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
        <span style={{ font: "var(--type-meta)", color: "var(--text-muted)", textWrap: "pretty" }}>{says}</span>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--text-disabled)" }}>{spec}</span>
      </div>
    </section>
  );
}

function Board({ theme }) {
  const OPS = "#FF7A45", DS = "#4C8DFF", RES = "#2FD08A";
  return (
    <div className={"app " + (theme === "paper" ? "paper" : theme)}
      style={{ background: "var(--background)", backgroundImage: "var(--canvas-image, none)", padding: 20, borderRadius: "var(--radius-2xl)",
        boxShadow: "var(--shadow-ring)", display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(340px, 1fr))", gap: "28px 24px" }}>

      <Spec n="1" title="Chip · out of the word" spec="0.42s · cubic-bezier(.2,.9,.24,1) · blur 3→0" tall={118}
        says="It rises out of the line it was read from and settles. Claims a cause: this chip came from that word.">
        <span style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 11 }}>
          <span style={{ font: "var(--weight-regular) 17px/24px var(--font-sans)", color: "var(--text-primary)" }}>
            Ship the boots <span style={{ position: "relative", whiteSpace: "nowrap" }}>tomorrow
              <span className="m-underline" style={{ position: "absolute", left: 0, right: 0, bottom: -1, height: 2, borderRadius: 1, background: "rgba(var(--accent-rgb), 0.55)" }} />
            </span>
          </span>
          <Chip cls="m-chip-a" tone="var(--accent)" glyph="calendar">Tomorrow</Chip>
        </span>
      </Spec>

      <Spec n="2" title="Task arrives" spec="0.42s settle · list held still" tall={132}
        says="The card settles into place and nothing else moves. The rows it displaces take their new positions at once — the eye is following the new card, and animating the rows it pushed would be the interface reacting to itself.">
        <span style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <Card cls="m-settle" title="Ship the boots" meta="30 min" hue={RES} />
          <Card title="Draft the launch brief" meta="90 min" hue={OPS} />
          <Card title="German — unit 4" meta="60 min" hue={DS} />
        </span>
      </Spec>

      <Spec n="3" title="Task closed" spec="ring 0.30s · strike 0.26s · row stays" tall={132}
        says="The ring fills and the title strikes. The row does not go anywhere: closing is a change of state, not a removal, and a list that empties under your hand is a list you cannot check your work against. It is gone next time you open the day.">
        <span style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <Card title="Book the dentist" meta="15 min" hue={RES} done strike />
          <Card title="German — unit 4" meta="60 min" hue={DS} />
        </span>
      </Spec>

      <Spec n="4" title="Part closed" spec="0.42s settle on the mark only"
        says="Only the counter changed, so only the counter moves — and it settles rather than spinning. A rolling digit animates the number itself, which reads as a machine counting instead of a fact updating.">
        <span style={{ display: "flex", alignItems: "center", gap: 11 }}>
          <span style={{ font: "var(--type-ui-medium)", color: "var(--text-primary)" }}>Draft the launch brief</span>
          <span className="m-settle" style={{ display: "inline-flex", alignItems: "center", height: 18, padding: "0 6px", borderRadius: "var(--radius-xs)",
            background: "var(--fill-3)", font: "var(--type-meta-medium)", color: "var(--text-secondary)", fontVariantNumeric: "tabular-nums" }}>2/3</span>
        </span>
      </Spec>

      <Spec n="5" title="Block placed by the scheduler" spec="0.42s settle · the hour is not touched" tall={132}
        says="The block settles onto its hour. The hour itself does not flash: the block appearing there IS where, and lighting the row as well says the same thing twice.">
        <span style={{ position: "relative", display: "block", height: 100 }}>
          {[0, 1, 2].map((i) => (
            <span key={i} style={{ position: "absolute", left: 0, right: 0, top: i * 34, height: 34,
              boxShadow: "var(--border) 0 -1px 0 0 inset" }}>
              <span style={{ position: "absolute", left: 0, top: -7, fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--text-disabled)" }}>{9 + i}:00</span>
            </span>
          ))}
          <span className="m-settle" style={{ position: "absolute", left: 44, right: 4, top: 36, height: 30 }}>
            <Card title="Ship the boots" meta="30 min" hue={RES} />
          </span>
        </span>
      </Spec>

      <Spec n="6" title="Habit kept" spec="fill 0.34s clip-path · pop 0.36s">
        <span style={{ display: "flex", alignItems: "center", gap: 11 }}>
          <span className="m-habit-pop" style={{ position: "relative", width: 22, height: 22, borderRadius: 6, background: "var(--fill-3)", overflow: "hidden" }}>
            <span className="m-habit-fill" style={{ position: "absolute", inset: 0, background: DS }} />
          </span>
          <span style={{ font: "var(--type-ui)", color: "var(--text-primary)" }}>German · 18:00</span>
          <span style={{ display: "flex", gap: 2 }}>
            {[1, 1, 0, 1, 1, 1, 0].map((v, i) => <span key={i} style={{ width: 8, height: 8, borderRadius: 2, background: v ? "color-mix(in oklab, " + DS + " 70%, transparent)" : "var(--fill-3)" }} />)}
          </span>
        </span>
      </Spec>

      <Spec n="7" title="Tag turned on" spec="0.38s · max-width then colour · (.2,.8,.2,1)"
        says="It opens its own width first and colours second, so the row reflows without anything jumping sideways.">
        <span style={{ display: "flex", alignItems: "center" }}>
          <Chip tone="var(--text-tertiary)" style={{ marginRight: 5 }}>errand</Chip>
          <Chip cls="m-tag" tone={RES} glyph="tag">money</Chip>
          <Chip tone="var(--text-tertiary)">deep work</Chip>
        </span>
      </Spec>

      <Spec n="8" title="Several at once" spec="one 0.42s settle on the group" tall={158}
        says="Dictation, or the planner filling a day. Three tasks made by one act are one thing that changed, so they settle together — a stagger turns one event into three and makes the app look like it is thinking.">
        <span className="m-settle" style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {[["Finish the Q3 budget", "45 min", OPS], ["Schedule the team sync", "30 min", DS], ["Buy milk after work", "15 min", RES]].map(([t, m, c]) => (
            <Card key={t} title={t} meta={m} hue={c} />
          ))}
        </span>
      </Spec>
    </div>
  );
}

function App() {
  const [theme, setTheme] = React.useState("dark");
  const [, glyphs] = React.useState(0);
  React.useEffect(() => {
    function ready() { glyphs((n) => n + 1); }
    window.addEventListener("needt-icons", ready);
    if (window.NeedtIcons) ready();
    return () => window.removeEventListener("needt-icons", ready);
  }, []);
  return (
    <div className="app" style={{ minHeight: "100%", background: "var(--background)", padding: "24px 24px 60px", display: "flex", flexDirection: "column", gap: 20 }}>
      <header style={{ display: "flex", alignItems: "flex-end", gap: 20, flexWrap: "wrap" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1, minWidth: 300 }}>
          <h1 style={{ margin: 0, font: "var(--type-page-title)", color: "var(--text-primary)" }}>Motion — what each one claims</h1>
          <span style={{ font: "var(--type-meta)", color: "var(--text-muted)", maxWidth: 760, textWrap: "pretty" }}>
            One rule, drawn from what you kept: motion belongs to the thing that changed and never to its surroundings. So every
            event here is the same 0.42s rise-and-settle on the one element that is new — and the list, the hour row and the
            neighbours hold still. Replay any of them.
          </span>
        </div>
        <ToggleGroup value={theme} onChange={setTheme} label="Theme"
          items={[{ value: "paper", label: "Paper" }, { value: "dim", label: "Dim" }, { value: "dark", label: "Dark" }]} />
      </header>
      <Board theme={theme} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
