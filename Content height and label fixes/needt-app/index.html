<script>
/* Measurement harness: content height per screen, sidebar and fixed elements
   excluded. Used to check that a screen fills the canvas it is given. */
window.measure = function () {
  const main = document.querySelector("main");
  const mr = main.getBoundingClientRect();
  let content = mr.top, surface = mr.top;
  main.querySelectorAll("*").forEach((el) => {
    if (el.closest(".nt-scrim, .floating, .nt-tooltip")) return;
    const cs = getComputedStyle(el);
    if (cs.visibility === "hidden" || cs.opacity === "0" || cs.position === "fixed") return;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) return;
    const b = Math.min(r.bottom, mr.bottom);
    const painted = cs.backgroundColor !== "rgba(0, 0, 0, 0)" || cs.boxShadow !== "none";
    const hasText = Array.from(el.childNodes).some((n) => n.nodeType === 3 && n.textContent.trim());
    const leaf = el.children.length === 0 && (painted || parseFloat(cs.borderTopWidth) > 0);
    if (painted || hasText) { if (b > surface) surface = b; }
    if (hasText || leaf) { if (b > content) content = b; }
  });
  return { content: Math.round(content - mr.top), surface: Math.round(surface - mr.top), of: Math.round(mr.height) };
};
</script>
