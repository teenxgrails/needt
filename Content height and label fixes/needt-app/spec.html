<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Needt — developer specification</title>
<link rel="stylesheet" href="../_ds/needt-design-system-main-25d3c8e5-a812-464d-881f-e887b9adef4b/styles.css">
<link rel="stylesheet" href="themes.css?v=3">
<link rel="stylesheet" href="exposure-wordmark.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../_ds/needt-design-system-main-25d3c8e5-a812-464d-881f-e887b9adef4b/_ds_bundle.js"></script>
<script type="module" src="needt-icons.js?v=8"></script>
<script src="Data.js?v=2"></script>
<style>
html,body{height:100%;margin:0;background:var(--background);overflow:auto}#root{width:100%}
.sp code { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); background: var(--fill-2); padding: 1px 5px; border-radius: var(--radius-xs); }
.sp table { width: 100%; border-collapse: collapse; }
.sp th { text-align: left; font: var(--type-meta-medium); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-quaternary); padding: 0 12px 7px 0; }
.sp td { font: var(--type-meta); color: var(--text-secondary); padding: 7px 12px 7px 0; box-shadow: var(--border) 0 -1px 0 0 inset; vertical-align: baseline; text-wrap: pretty; }
.sp td:first-child { font-family: var(--font-mono); font-size: 11px; color: var(--text-primary); white-space: nowrap; }
.sp p { margin: 0; font: var(--type-body); color: var(--text-secondary); text-wrap: pretty; max-width: 74ch; }
/* Emphasis by ink, not by weight: there is no 16/700 on the scale. */
.sp strong { font-weight: inherit; color: var(--text-primary); }
@media print {
  body { background: #fff; }
  .sp-nav { display: none; }
}
</style>
</head><body><div id="root"></div>
<script type="text/babel">
/* THE HANDOFF.
 *
 * This is not a description of the kit — the kit describes itself, and every
 * specimen in blocks.html is the live component. This page is the set of
 * DECISIONS a developer cannot read off a screenshot: what owns what, what is
 * a token and what is a literal, which states exist, and what each motion
 * claims. Where the kit already answers something, this page points at the
 * file rather than repeating it, because a duplicated answer is an answer that
 * will drift. */
const NS = window.NeedtDesignSystem_25d3c8;
const { Icon, Button } = NS;

function H({ n, title, children }) {
  return (
    <section style={{ display: "flex", flexDirection: "column", gap: 14, paddingTop: 34 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 11 }}>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--text-disabled)" }}>{n}</span>
        <h2 style={{ margin: 0, font: "var(--type-page-title)", color: "var(--text-primary)" }}>{title}</h2>
      </div>
      {children}
    </section>
  );
}

function Table({ head, rows }) {
  return (
    <table>
      <thead><tr>{head.map((h) => <th key={h}>{h}</th>)}</tr></thead>
      <tbody>{rows.map((r, i) => <tr key={i}>{r.map((c, j) => <td key={j}>{c}</td>)}</tr>)}</tbody>
    </table>
  );
}

function Note({ children }) {
  return (
    <p style={{ paddingLeft: 13, boxShadow: "var(--accent) 2px 0 0 0 inset", font: "var(--type-body)", color: "var(--text-secondary)" }}>{children}</p>
  );
}

function App() {
  const [, glyphs] = React.useState(0);
  React.useEffect(() => {
    function ready() { glyphs((n) => n + 1); }
    window.addEventListener("needt-icons", ready);
    if (window.NeedtIcons) ready();
    return () => window.removeEventListener("needt-icons", ready);
  }, []);

  return (
    <div className="app sp" style={{ minHeight: "100%", background: "var(--background)", padding: "28px 28px 80px", maxWidth: 1080, margin: "0 auto" }}>
      <header style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {/* The largest alias the system defines — there is no doc-H1 token, so
            inventing a size here would be the defect this page documents. */}
        <h1 style={{ margin: 0, font: "var(--type-page-title)", color: "var(--text-primary)" }}>Needt — what to build, and what owns it</h1>
        <p>
          The kit is the reference implementation: every screen in <code>index.html</code> and <code>mobile.html</code> runs the
          real components. This page carries the decisions behind them — ownership, tokens, states, motion — and points at the
          file for anything the kit already shows.
        </p>
        <div className="sp-nav" style={{ display: "flex", gap: 8, flexWrap: "wrap", paddingTop: 6 }}>
          {[["Desktop", "index.html"], ["Phone", "mobile.html"], ["Object inventory", "blocks.html"], ["Motion", "motion-lab.html"], ["The block", "rich-block.html"], ["Account & setup", "auth.html"]].map(([label, href]) => (
            <Button key={href} size="sm" variant="flat" iconRight={<Icon name="arrow-up-right" size={13} />} onClick={() => { window.location.href = href; }}>{label}</Button>
          ))}
        </div>
      </header>

      <H n="1" title="Stack, and what does not port">
        <p>
          The product is Next.js + React + Tailwind with <code>react-icons</code>. The kit is plain React over
          Babel-in-browser with globals instead of modules, so three things need translating and nothing else:
        </p>
        <Table head={["In the kit", "In the product", "Why"]} rows={[
          ["window.X = …", "named exports", "The kit shares one scope on purpose — a second top-level const with the same name silently clobbers the first. That hazard is what the prefixes (CAL_, RB_, CV_, HB_) exist for, and it disappears with modules."],
          ["<Icon name=\"…\">", "<Icon glyph={LuX}> or the react-icons component", "The design system's Icon is a contract, not a dependency: it renders the glyph you pass. needt-icons.js is host code and exists so static pages have a registry — the app imports directly and needs none of it."],
          ["Data.js globals", "your store / server data", "window.NEEDT is one seed set behind one accessor. Replace the source, keep the accessor shape: project(ref), projects, calendars, tasks, habits, streak(), closedDays, today."],
          ["text/babel scripts", "ordinary imports", "No build in the kit is deliberate: the preview must run from a file. Nothing in the components depends on it."]
        ]} />
      </H>

      <H n="2" title="One task, three layouts">
        <Note>
          This is the single most important line in the document. A task is <code>RichBlock</code>, and nothing else draws a
          task. Three surfaces choose a layout; none of them shapes its own props.
        </Note>
        <Table head={["Piece", "File", "Job"]} rows={[
          ["RichBlock", "RichBlock.jsx", "Every appearance of a task. weight=\"block\" on the hour grid, \"open\"/fit as a card, \"row\" in the Workspace table, \"compressed\" for a one-line block, \"declined\" for a slot that says only its time."],
          ["rbShape(t, ctx)", "RichBlock.jsx", "The ONLY translation from a task to the block. ctx: {layout, dense, reason}. It resolves the project — id and hue and display name — so a caller may pass \"ops\" or \"Operations\" and the screen shows the name either way."],
          ["Block", "BlockDesigns.jsx", "The grid's adapter: measures the slot, converts a time string to from/to, calls rbShape. It owns nothing about appearance."],
          ["CvCard", "ColumnsView.jsx", "The card adapter: one call to rbShape, one RichBlock. 40 lines of prop-shaping were deleted when the adapter landed."],
          ["TaskRow", "TaskRow.jsx", "The TABLE — column widths, head, part indent. It renders RichBlock at weight=\"row\" and draws no task marks itself."]
        ]} />
        <p>
          The collapse order lives in <code>RichBlock</code> and is the reason nothing is ever clipped: every fact has a
          height and a rank, the block is handed the height it has, and it spends it down the list. A fact is shown whole or
          not shown. Rank order: where you have to be, how to start, what it is about.
        </p>
      </H>

      <H n="3" title="What carries meaning">
        <Note>
          Four channels, one meaning each. A fifth use of colour is a defect, not a feature.
        </Note>
        <Table head={["Channel", "Means", "Rule"]} rows={[
          ["hue", "which project", "The project owns it — window.NEEDT.projects. Colour on screen is the user's own data, never a palette choice. An event takes its calendar's colour instead, because an event has no project."],
          ["edge", "movability", "Fixed wears a hairline in the hue plus a lock on the tile; movable wears none. It moved here from the rail when colour took the body, and it is readable at every height."],
          ["tile", "where it came from", "Source mark when there is one, project glyph otherwise. Flat, one step of lift, light from above — the dock's dimensional squircle read as pasted in from another product."],
          ["red", "at risk", "Overdue or must-not-slip. On the row and the card it is a dot plus words; never a second red on the time or the title."],
          ["EXPO −40", "overdue title", "The variable axis inks the title. It eases to 0 over 400ms when the task is dealt with — the only motion on the grid."]
        ]} />
      </H>

      <H n="4" title="Tokens, and the four rules that outrank taste">
        <Table head={["Rule", "What it means here"]} rows={[
          ["Every grey is one text colour at a ladder alpha", "text 100/85/70/55/40/25, fills 2/3/4/6/8/12. No new grey anywhere in the kit. If a value is not on the ladder it is a mistake."],
          ["Interface type is 13px and 12px only", "16px is document body — the brief, the description line. There is no 14px in the chrome."],
          ["The accent is never a solid fill on a button or a surface", "Translucent at 12% or 24% with the accent as the text. Solid accent belongs to a MARK: the switch knob, a status dot, the now-line."],
          ["One form-label width, one row height", "--form-label-w: 105px, --form-row-h: 32px. A label that does not fit gets SHORTENED — widening the column re-opens the defect the measurement exists to close."]
        ]} />
        <p>
          Three additions this kit makes on top of the system, all in <code>themes.css</code>:
          the <strong>paper</strong> and <strong>warm</strong> themes; a <strong>drift</strong> layer that moves ground
          temperature and text contrast by the sun and never touches the accent; and a rebuilt raised-shadow stack for dark
          grounds — a black shadow under a dark surface separates nothing, so the dark stack is a directional bevel (bright
          top, dark underside) over deepened cast layers.
        </p>
      </H>

      <H n="5" title="State inventory">
        <p>Every state below exists in the kit and is reachable. If a state is not in this table it was not designed.</p>
        <Table head={["Object", "States"]} rows={[
          ["Task", "open · done · overdue · at risk · no slot (no rail, nothing to move) · with parts n/m · part promoted to task · grouped (a category block whose rows are its tasks) · moved by the scheduler (a stable mark, not a re-animation) · aged 21d / 42d (title steps down the ladder) · with money listed and received"],
          ["Block on the grid", "task · event · external source · fixed · compressed (< 40px) · declined · habit (standing, grey rail) · divided rail per part · entry line · landing preview · refused landing with the reason"],
          ["Day column", "loaded · empty (keeps full height) · overdue · no date · oversubscribed (says what will not fit before you press) · today"],
          ["Composer", "closed · arriving from its origin · idle · live (tube up, breathing) · listening (level bars) · drafts from dictation · shelf open (panel grows upward) · description open · discharging on create"],
          ["Focus", "off · running (corner aura, live clock, wordmark held) · finished"],
          ["Screen", "cold (veil while it builds) · warm (instant) · empty · loading (skeleton in the shape of what is coming)"],
          ["Theme", "paper · warm · dim · dark · system pair · drift on/off · reduced motion"]
        ]} />
      </H>

      <H n="6" title="Motion — the map is the contract">
        <p>
          Every animation in the product, with the number to build it against, is sheet G of <code>blocks.html</code>:
          name, duration, curve, trigger, and what it claims. Anything not on that list is not in the product. Two rules
          about it:
        </p>
        <Table head={["Rule", "Why"]} rows={[
          ["Everything alive breathes at 5.2s", "The wordmark, the focus aura, the focus ring and the composer's tube share one period. Two periods on one screen read as two products."],
          ["A transition and an animation must agree at the handoff", "The composer's glow fades up over 0.7s and the breath takes over at exactly that moment, so the breath's first frame is full. A cycle that opened dimmer dropped the glow the instant it began — that class of defect is invisible in code and obvious on screen."],
          ["prefers-reduced-motion removes motion, not state", "The focus aura stops breathing and stays lit. A state that disappears under reduced motion was never a state."]
        ]} />
      </H>

      <H n="7" title="Data shape">
        <p>Seeded in <code>Data.js</code>; the accessor is what the components depend on.</p>
        <Table head={["Field", "Shape", "Note"]} rows={[
          ["task", "{id, title, project, due, est, done, status, overdue, noSlot, value, earned, parts[], entry, note, age, movedFrom, priority, risk}", "parts are one level. A part has {title, done} and no slot of its own; promotion is the only way it becomes a task."],
          ["project", "{id, name, hue, glyph}", "The hue is data. Resolve with NEEDT.project(ref) — it accepts an id or a display name."],
          ["habit", "{id, title, at, project, done[14]}", "done is the last fourteen days, oldest first. A miss is an empty square and nothing else — no debt, no Overdue entry."],
          ["day closed", "everything due that day was closed", "The streak counts closed days. Chosen because it cannot be farmed by adding empty tasks — a definition based on completion alone can."],
          ["calendar", "{id, name, color}", "An event's colour comes from here, never from a project."]
        ]} />
      </H>

      <H n="8" title="Open, and deliberately not built">
        <Table head={["Item", "Standing"]} rows={[
          ["Mobile parity", "Five screens exist — Home, Calendar, task, focus, capture. The rest is the same components in the phone shell; each new screen is another set of states to keep in step across two shells."],
          ["Workspace projects", "List, Kanban and Gantt exist as views. What is stuck and why — stages, blockers, dependsOn — was designed and set aside at your call."],
          ["Two-minute box", "The entry exists on the task. The shelf that offers one for any gap under fifteen minutes is not built."],
          ["Marey plan/fact chart", "Agreed as an object in the brief field. Not built."],
          ["Sequence day", "A day as a list of durations with meetings as anchors. Agreed as a third calendar mode. Not built."],
          ["Real street geometry", "The map came out of the block by your call. If it returns: vector geometry from data, never hand-drawn streets."]
        ]} />
      </H>

      <footer style={{ paddingTop: 34, display: "flex", flexDirection: "column", gap: 6 }}>
        <span style={{ font: "var(--type-meta-medium)", letterSpacing: "0.04em", textTransform: "uppercase", color: "var(--text-quaternary)" }}>One line to keep</span>
        <p>
          When something looks wrong, check ownership before geometry. Nearly every defect in this build came from two
          things owning one fact — two shadows, two glows, two project tables, two money formatters, two ways of saying a
          block should fit. The fix was never a number; it was deleting the second owner.
        </p>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
